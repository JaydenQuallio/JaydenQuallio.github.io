<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="description" content="Searchable Valheim crafting atlas: recipes, upgrade costs, stats, building pieces, stations and material sources for a modded profile."></head><body>
<title>Valheim Crafting Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Dark-first: a hearth in an iron hall. Light mode swaps the same roles. */
:root{
  color-scheme: dark;
  --bg:#0f1113; --surface:#15181b; --surface-2:#1b1f23; --surface-3:#242a2f; --raise:#1e2227;
  --line:#2b3137; --line-soft:#20252a;
  --text:#ece6da; --muted:#a29c90; --faint:#6e6a63;
  --accent:#f2a541; --accent-soft:rgba(242,165,65,.13); --accent-line:rgba(242,165,65,.45); --accent-ink:#1a1206; --link:#f6bb66;
  --frost:#8cc8e3; --frost-soft:rgba(140,200,227,.12);
  --good:#9cc46a; --bad:#ec6a4f; --warn:#e4c25a;
  --d-slash:#cfd3d8; --d-pierce:#c4ad84; --d-blunt:#a8977c; --d-fire:#ea6f3c; --d-frost:#86c9ee; --d-lightning:#ecd54e;
  --d-poison:#95c955; --d-spirit:#c8b6ff; --d-damage:#f1ece2; --d-chop:#b98246; --d-pickaxe:#8f96a3;
  --r0:#45a8f0; --r1:#e3cf4b; --r2:#b879f0; --r3:#2fcf9c; --r4:#ff8c3a; --r5:#e8534f;
  --shadow:0 24px 60px rgba(0,0,0,.5);
  --display:"Grenze", Georgia, "Times New Roman", serif;
  --sans:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --top:60px; --side:236px; --detail:430px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --bg:#eeece7; --surface:#fbfaf7; --surface-2:#f3f1ec; --surface-3:#e6e2da; --raise:#ffffff;
    --line:#d5cfc3; --line-soft:#e4dfd6;
    --text:#1d1a16; --muted:#5f584d; --faint:#958c7e;
    --accent:#b0600c; --accent-soft:rgba(176,96,12,.11); --accent-line:rgba(176,96,12,.45); --accent-ink:#fff8ee; --link:#9a4f06;
    --frost:#2c6c88; --frost-soft:rgba(44,108,136,.1);
    --good:#4e7c1f; --bad:#b33b21; --warn:#8a6a08;
    --d-slash:#5d646e; --d-pierce:#8a6d3b; --d-blunt:#6f604b; --d-fire:#c9471a; --d-frost:#2f86b3; --d-lightning:#a88d0a;
    --d-poison:#4f8a1c; --d-spirit:#6f55c9; --d-damage:#3b342b; --d-chop:#8a5a26; --d-pickaxe:#5b6270;
    --r0:#1f7fc9; --r1:#a48c0c; --r2:#8a47c7; --r3:#13916a; --r4:#d0661a; --r5:#c2302c;
    --shadow:0 24px 60px rgba(40,30,15,.18);
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#eeece7; --surface:#fbfaf7; --surface-2:#f3f1ec; --surface-3:#e6e2da; --raise:#ffffff;
  --line:#d5cfc3; --line-soft:#e4dfd6;
  --text:#1d1a16; --muted:#5f584d; --faint:#958c7e;
  --accent:#b0600c; --accent-soft:rgba(176,96,12,.11); --accent-line:rgba(176,96,12,.45); --accent-ink:#fff8ee; --link:#9a4f06;
  --frost:#2c6c88; --frost-soft:rgba(44,108,136,.1);
  --good:#4e7c1f; --bad:#b33b21; --warn:#8a6a08;
  --d-slash:#5d646e; --d-pierce:#8a6d3b; --d-blunt:#6f604b; --d-fire:#c9471a; --d-frost:#2f86b3; --d-lightning:#a88d0a;
  --d-poison:#4f8a1c; --d-spirit:#6f55c9; --d-damage:#3b342b; --d-chop:#8a5a26; --d-pickaxe:#5b6270;
  --r0:#1f7fc9; --r1:#a48c0c; --r2:#8a47c7; --r3:#13916a; --r4:#d0661a; --r5:#c2302c;
  --shadow:0 24px 60px rgba(40,30,15,.18);
}
:root[data-theme="dark"]{ color-scheme: dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0; color:var(--text); font-family:var(--sans); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased}
button,select,input{font:inherit; color:inherit}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
.mono, td.num{font-family:var(--mono); font-variant-numeric:tabular-nums}
.dim{color:var(--faint)}
.muted{color:var(--muted)}

/* ---------- app shell */
.topbar{position:sticky; top:env(safe-area-inset-top, 0px); z-index:30; height:var(--top); display:flex; align-items:center; gap:14px;
  padding-inline:16px; background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line-soft)}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--text); flex:none; border:0; background:none; cursor:pointer; padding:0}
.brand svg{color:var(--accent); flex:none}
.brand b{font-family:var(--display); font-weight:600; font-size:22px; letter-spacing:.01em; line-height:1}
.brand small{display:block; font-size:11px; color:var(--faint); letter-spacing:.04em; margin-top:2px}
.search{flex:1; min-width:0; max-width:640px; margin-inline:auto; position:relative; display:flex; align-items:center; gap:8px; height:40px; padding-inline:12px;
  background:var(--surface); border:1px solid var(--line); border-radius:10px}
.search:focus-within{border-color:var(--accent-line); box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{flex:none; color:var(--muted)}
.search input{flex:1; min-width:0; border:0; background:transparent; font-size:15px; outline:none}
.search input::placeholder{color:var(--faint)}
.search kbd{font-family:var(--mono); font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:5px; padding:0 6px}
.worldbtn{flex:none; display:flex; align-items:center; gap:8px; height:40px; padding:0 12px 0 8px; border-radius:10px; border:1px solid var(--line); background:var(--surface); cursor:pointer; font-size:12.5px; color:var(--muted)}
.worldbtn:hover{border-color:var(--accent-line); color:var(--text)}
.worldbtn .wtxt{white-space:nowrap}
.navbtn{display:none; flex:none; width:40px; height:40px; border-radius:10px; border:1px solid var(--line); background:var(--surface); cursor:pointer; place-items:center; color:var(--muted)}

.shell{display:grid; grid-template-columns:var(--side) minmax(0,1fr); align-items:start}
.shell.with-detail{grid-template-columns:var(--side) minmax(0,1fr) var(--detail)}
.sidebar{position:sticky; top:calc(env(safe-area-inset-top, 0px) + var(--top)); height:calc(100dvh - var(--top) - env(safe-area-inset-top, 0px)); overflow-y:auto;
  padding:14px 10px 30px 12px; border-right:1px solid var(--line-soft); scrollbar-width:thin}
.main{min-width:0; padding:22px 28px 60px}
.nav-h{font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--faint); margin:18px 10px 6px; font-weight:600}
.nav-i{display:flex; align-items:center; gap:10px; width:100%; border:0; background:none; text-align:left; padding:7px 10px; border-radius:8px; cursor:pointer; color:var(--muted); font-size:13.5px; font-weight:500}
.nav-i svg{flex:none; width:17px; height:17px; color:var(--faint)}
.nav-i .ct{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--faint)}
.nav-i:hover{background:var(--surface-2); color:var(--text)}
.nav-i[aria-current="page"]{background:var(--accent-soft); color:var(--text)}
.nav-i[aria-current="page"] svg{color:var(--accent)}
.nav-i.zero{opacity:.4}
.nav-i.search-all{color:var(--text)}
.sidebar .foot-note{margin:22px 10px 0; font-size:11.5px; color:var(--faint); line-height:1.45}
.scrim{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:35}

/* ---------- page head */
.ph{display:grid; gap:10px; margin-bottom:18px}
.eyebrow{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:600}
.ph-title{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.ph h1{font-family:var(--display); font-weight:600; font-size:34px; line-height:1.05; margin:0; letter-spacing:.005em; text-wrap:balance}
.ph .ct{font-family:var(--mono); font-size:13px; color:var(--faint)}
.ph p.lede{margin:0; color:var(--muted); max-width:72ch; font-size:14px}
.tools{display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; margin-top:4px}
.ctl{height:32px; border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:0 10px; font-size:12.5px; color:var(--text); cursor:pointer}
select.ctl{padding-right:26px; appearance:none; background-image:linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position:calc(100% - 13px) 14px, calc(100% - 9px) 14px; background-size:4px 4px; background-repeat:no-repeat}
.ctl:hover{border-color:var(--accent-line)}
.toggle{display:inline-flex; align-items:center; gap:7px; font-size:12.5px; color:var(--muted); cursor:pointer; user-select:none}
.toggle input{accent-color:var(--accent)}
.tools .grow{flex:1}
.iconbtn{border:1px solid var(--line); background:var(--surface); border-radius:8px; width:32px; height:32px; display:inline-grid; place-items:center; cursor:pointer; color:var(--muted); flex:none}
.iconbtn:hover{color:var(--text); border-color:var(--accent-line)}
.tabs{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; border-bottom:1px solid var(--line-soft); margin-top:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none; border:0; background:none; padding:9px 12px 10px; cursor:pointer; color:var(--muted); font-size:13px; font-weight:500; border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; display:inline-flex; gap:6px; align-items:baseline}
.tab .ct{font-family:var(--mono); font-size:10.5px; color:var(--faint)}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--text); border-bottom-color:var(--accent)}
.subselect{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted)}
.subselect select{max-width:min(360px, 70vw)}

/* ---------- sections & tables */
.sec{margin-bottom:22px}
.sec-h{display:flex; align-items:center; gap:10px; margin:0 0 8px; cursor:pointer; user-select:none; border-radius:8px; padding:2px 4px 2px 0}
.sec-h h2{font-size:15.5px; font-weight:600; margin:0; letter-spacing:.005em}
.sec-h .ct{font-family:var(--mono); color:var(--faint); font-size:11.5px}
.sec-h .note{color:var(--faint); font-size:12px}
.sec-h:hover h2{color:var(--link)}
.chev{flex:none; width:20px; height:20px; display:inline-grid; place-items:center; color:var(--faint); transition:transform .15s ease}
.sec.closed .chev, .stage.closed .chev, .fold.closed .chev{transform:rotate(-90deg)}
.sec.closed .tbl-wrap{display:none}
.sec.closed{margin-bottom:8px}
.tbl-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:12px; background:var(--surface)}
table{border-collapse:collapse; width:100%; font-size:13px}
th{background:var(--surface-2); text-align:left; font-weight:600; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding:9px 10px; border-bottom:1px solid var(--line); white-space:nowrap; cursor:pointer; user-select:none}
th:hover{color:var(--text)}
th .sa{color:var(--accent)}
th.num, td.num{text-align:right}
td{padding:8px 10px; border-bottom:1px solid var(--line-soft); vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tbody tr.on td{background:var(--accent-soft)}
td.num{font-size:12.5px}
.more{display:block; width:100%; text-align:center; padding:9px; background:var(--surface-2); border:0; border-top:1px solid var(--line-soft); color:var(--link); cursor:pointer; font-size:12.5px; border-radius:0 0 12px 12px}
.more:hover{background:var(--surface-3)}
.nm{display:flex; gap:10px; align-items:center; min-width:190px}
.nm b{font-weight:600; font-size:13.5px; display:block; line-height:1.25}
.nm small{color:var(--muted); font-size:11.5px; display:block}
.tag{display:inline-block; font-size:10.5px; letter-spacing:.03em; padding:0 6px; border-radius:5px; border:1px solid var(--line); color:var(--muted); line-height:17px; vertical-align:1px; white-space:nowrap}
.tag.mod{border-color:transparent; background:var(--surface-3)}
.tag.boss{background:var(--bad); color:#fff; border-color:transparent}
.tag.warn{color:var(--warn); border-color:currentColor}
.tag.ok{color:var(--good); border-color:currentColor}

/* icons */
.ic{--s:28px; flex:none; display:inline-block; width:var(--s); height:var(--s); background-image:var(--icons); background-repeat:no-repeat;
  background-size:calc(var(--cols) * var(--s)) auto; background-position:calc(var(--x) * var(--s) * -1) calc(var(--y) * var(--s) * -1)}
.ic.none{background:var(--surface-3); border-radius:6px; display:inline-grid; place-items:center; color:var(--faint); font-family:var(--display); font-size:calc(var(--s) * .5)}
.glyph{flex:none; display:inline-grid; place-items:center; width:var(--g); height:var(--g); border-radius:7px; background:var(--surface-3); color:var(--muted)}
.glyph svg{width:62%; height:62%}
.ic.s18{--s:18px} .ic.s22{--s:22px} .ic.s36{--s:36px} .ic.s44{--s:44px} .ic.s56{--s:56px}

.st{display:inline-flex; align-items:center; gap:6px; white-space:nowrap}
.st em{font-style:normal; font-family:var(--mono); font-size:11px; color:var(--accent); background:var(--accent-soft); border-radius:4px; padding:0 5px}
.st.hand{color:var(--muted)}
.mats{display:flex; flex-wrap:wrap; gap:3px 7px; min-width:110px; max-width:240px}
.mat{display:inline-flex; align-items:center; gap:2px; border:0; background:none; padding:0; cursor:pointer}
.mat b{font-family:var(--mono); font-weight:500; font-size:11.5px}
.mat:hover b{color:var(--link)}
.dmg{display:grid; gap:3px; justify-items:end; min-width:96px}
.dmg .nums{white-space:nowrap; font-family:var(--mono); font-size:12.5px}
.dmg .nums .arr{color:var(--faint); margin:0 3px}
.dmg .nums .mx{color:var(--text); font-weight:500}
.dbar{display:flex; height:5px; width:100%; max-width:150px; border-radius:3px; overflow:hidden; background:var(--surface-3)}
.dbar i{display:block; height:100%}
.d-slash{background:var(--d-slash)} .d-pierce{background:var(--d-pierce)} .d-blunt{background:var(--d-blunt)} .d-fire{background:var(--d-fire)}
.d-frost{background:var(--d-frost)} .d-lightning{background:var(--d-lightning)} .d-poison{background:var(--d-poison)} .d-spirit{background:var(--d-spirit)}
.d-damage{background:var(--d-damage)} .d-chop{background:var(--d-chop)} .d-pickaxe{background:var(--d-pickaxe)}
.dt{display:inline-flex; align-items:center; gap:5px; white-space:nowrap}
.dt::before{content:""; width:8px; height:8px; border-radius:2px; background:var(--c, var(--muted))}
.up{color:var(--good); font-size:11px; margin-left:4px}
.down{color:var(--bad); font-size:11px; margin-left:4px}
.pillset{display:flex; flex-wrap:wrap; gap:5px}
.pill{font-size:11.5px; border-radius:999px; padding:2px 9px; background:var(--surface-3); white-space:nowrap}
.pill.good{background:color-mix(in srgb, var(--good) 18%, transparent); color:var(--good)}
.pill.bad{background:color-mix(in srgb, var(--bad) 16%, transparent); color:var(--bad)}
.tierp{display:inline-flex; align-items:center; gap:5px; font-size:11px; white-space:nowrap; padding:1px 8px; border-radius:999px; background:var(--surface-3); color:var(--muted)}
.tierp.now{background:var(--accent); color:var(--accent-ink); font-weight:600}
.tierp.done{opacity:.7}
.stars{color:var(--accent); font-family:var(--mono); white-space:nowrap}
.lnk{border:0; background:none; color:var(--link); cursor:pointer; font:inherit; padding:0; text-align:left}
.lnk:hover{text-decoration:underline}
.ok{color:var(--good)} .no{color:var(--bad)}
.empty{padding:44px 18px; text-align:center; color:var(--muted); border:1px dashed var(--line); border-radius:14px}
.empty b{color:var(--text)}
.loading{padding:90px 0; text-align:center; color:var(--muted); font-family:var(--display); font-size:22px}
.foot{color:var(--faint); font-size:12px; margin-top:34px; border-top:1px solid var(--line-soft); padding-top:14px; max-width:90ch}
.callout{border:1px solid var(--accent-line); background:var(--accent-soft); padding:10px 13px; border-radius:10px; font-size:13px; margin:0 0 14px}
.note{font-size:12px; color:var(--muted); margin:8px 0 0}

/* ---------- panels (world, comfort, enchanting, journey) */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 18px; min-width:0}
.panel > h2{font-size:17px; font-weight:600; margin:0 0 4px; text-wrap:balance}
.panel > .tip{color:var(--muted); font-size:13px; margin:0 0 12px; max-width:75ch}
.stack{display:grid; gap:16px}
.grid2{display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:16px}
.grid3{display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:16px}
.seg{display:flex; flex-wrap:wrap; border:1px solid var(--line); border-radius:9px; overflow:hidden; width:fit-content; max-width:100%}
.seg button{border:0; background:transparent; padding:6px 11px; cursor:pointer; font-size:12.5px; color:var(--muted); line-height:1.2; text-align:left}
.seg button + button{border-left:1px solid var(--line)}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.seg button .yours{display:block; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; opacity:.8}
.effects{margin:10px 0 0; padding:0; list-style:none; display:grid; gap:4px; font-size:13px}
.effects li{padding-left:14px; position:relative}
.effects li::before{content:""; position:absolute; left:2px; top:.6em; width:6px; height:6px; border-radius:2px; background:var(--accent)}
.range{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.range input[type=range]{accent-color:var(--accent); width:200px; max-width:60vw}
.prob{display:grid; gap:4px}
.prob .row{display:grid; grid-template-columns:62px minmax(0,1fr) 64px; gap:8px; align-items:center; font-size:12.5px}
.prob .track{height:8px; background:var(--surface-3); border-radius:4px; overflow:hidden}
.prob .track i{display:block; height:100%; background:var(--accent); border-radius:4px; min-width:2px}
.prob .v{font-family:var(--mono); text-align:right}
.wtable{width:100%; border-collapse:collapse; font-size:12.5px}
.wtable th{background:none; padding:5px 7px; cursor:default; font-size:10.5px; border-bottom:1px solid var(--line)}
.wtable td{padding:6px 7px; border-bottom:1px solid var(--line-soft); cursor:default; vertical-align:top}
.wtable tr:hover td{background:none}
.wtable td.num, .wtable th.num{text-align:right; font-family:var(--mono)}
.cond{font-size:12px; color:var(--muted)}
.cond b{color:var(--text)}
.rar{display:flex; height:8px; border-radius:4px; overflow:hidden; background:var(--surface-3); min-width:110px}
.rar i{display:block; height:100%}
.r0{background:var(--r0)} .r1{background:var(--r1)} .r2{background:var(--r2)} .r3{background:var(--r3)} .r4{background:var(--r4)} .r5{background:var(--r5)}
.legend{display:flex; flex-wrap:wrap; gap:10px; font-size:11.5px; color:var(--muted); margin-top:6px}
.legend span::before{content:""; display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; background:var(--c)}
.wx{display:grid; gap:5px}
.wx .row{display:grid; grid-template-columns:130px minmax(0,1fr) 48px; gap:8px; align-items:center; font-size:12.5px}
.kv{display:grid; grid-template-columns:repeat(auto-fill, minmax(130px,1fr)); gap:8px}
.kv > div{background:var(--surface-2); border-radius:9px; padding:8px 10px; min-width:0}
.kv span{display:block; font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted)}
.kv b{font-family:var(--mono); font-weight:500; font-size:15px}
.kv b small{font-size:11px; color:var(--muted); font-weight:400}
.grid-items{display:flex; flex-wrap:wrap; gap:5px}

const classById = id => D.playerClasses && D.playerClasses.classes.find(c => c.id === id);
function gearChip([id, o], t, showStat = true){

function bestAt(classes, t, n = 2){
  const at = [], before = [];
  for (const k of classes) for (const [id, o] of progressionOf(k)){ if (o.tier === t) at.push([id, o]); else if (o.tier < t) before.push([id, o]); }
  const sc = x => statAt(x[1], t);
  at.sort((a, b) => sc(b) - sc(a));
  before.sort((a, b) => sc(b) - sc(a));
  const keep = before[0] && (!at.length || sc(before[0]) > sc(at[0])) ? before[0] : null;
  return {list:at.slice(0, n), keep};
}
function bestHTML(label, b, t){

}
// ---------- armor & trinkets for the journey
// Damage taken multiplier per resistance, as a fraction of damage removed (Weak adds 50%).
const MODF = {Immune:1, Ignore:1, VeryResistant:0.75, Resistant:0.5, SlightlyResistant:0.25, SlightlyWeak:-0.25, Weak:-0.5, VeryWeak:-1};
const ARMOR_SLOTS = ["helmets","chest","legs","capes"];
const PROFILE_CACHE = {};
// What a stage's creatures (and, weighted up, its boss) hit with, and how hard a typical hit lands
// on the chosen difficulty.
function threatProfile(t){
  const key = t + ":" + dmgScale().toFixed(3);
  if (PROFILE_CACHE[key]) return PROFILE_CACHE[key];
  const biome = D.stages.biomes[t], boss = D.stages.bosses[t];
  const share = {}, hits = [];
  let tot = 0;
  const add = (c, w, keep) => { for (const a of c.atk || []){ if (!a[1] || !COMBAT.includes(a[2])) continue; share[a[2]] = (share[a[2]] || 0) + a[1] * w; tot += a[1] * w; if (keep) hits.push(a[1]); } };
  for (const c of Object.values(D.creatures)) if (!c.boss && (c.b || []).includes(biome)) add(c, 1, true);
  if (boss && D.creatures[boss]) add(D.creatures[boss], 3, false);
  for (const k in share) share[k] /= tot || 1;
  hits.sort((a, b) => a - b);
  const H = (hits.length ? hits[Math.floor(hits.length / 2)] : 30) * dmgScale();
  return PROFILE_CACHE[key] = {share, H, cold:biome === "Mountain" || biome === "DeepNorth", hot:biome === "AshLands"};
}
const profileText = p => Object.entries(p.share).sort((a, b) => b[1] - a[1]).filter(x => x[1] >= 0.05).slice(0, 4).map(([k, v]) => `${(DNAME[k] || k).toLowerCase()} ${Math.round(v * 100)}%`).join(", ");
const resOf = o => (o.res || []).map(([ty, m]) => [String(ty).toLowerCase(), MODF[m] ?? 0]);
function coverAdd(cov, o){ for (const [ty, f] of resOf(o)) cov[ty] = f > 0 ? Math.max(cov[ty] || 0, f) : (cov[ty] ?? f); }
// Armor worth in "armor points": the piece's armor at the upgrade reachable now, plus resistances valued as
// the damage they'd save on a typical hit (share of that damage type × reduction × hit size), plus the
// class's priorities (speed for light fighters, eitr regen for casters, stamina costs for melee).
function armorEval(o, t, style, prof, cov){
  let s = statAt(o, t);
  const why = [];
  for (const [ty, f] of resOf(o)){
    const have = cov[ty] || 0;

function pathCard(id, o){
  const cl = CLS[o.c];
  if (!cl || !["weapons","shields","armor","ammo","tools"].includes(cl.g) || o.tier == null || !RBI[id]) return "";
  const path = progressionOf(o.c);
  if (path.length < 2) return "";
  const byT = {};
  for (const [pid, po] of path) (byT[po.tier] ||= []).push([pid, po]);
  const tiers = Object.keys(byT).map(Number).sort((a, b) => a - b);
  const mine = keyStat(o), label = statLabel(o);
  const next = path.filter(([pid, po]) => po.tier > o.tier).sort((a, b) => a[1].tier - b[1].tier || keyStat(b[1]) - keyStat(a[1]))[0];
  const better = path.filter(([pid, po]) => po.tier === o.tier && keyStat(po) > mine).sort((a, b) => keyStat(b[1]) - keyStat(a[1]))[0];
  let tip = "";
  if (better) tip += `<p class="note" style="margin:0 0 8px">Same tier, more ${label}: <button class="lnk" data-go="item:${esc(better[0])}">${esc(better[1].n)}</button> (${fmt(keyStat(better[1]), 0)} vs ${fmt(mine, 0)}).</p>`;
  if (next) tip += `<p style="margin:0 0 10px">Next up: <button class="lnk" data-go="item:${esc(next[0])}">${esc(next[1].n)}</button> in the ${esc(tierName(next[1].tier))} tier, ${fmt(keyStat(next[1]), 0)} ${label}${mine ? ` (${keyStat(next[1]) >= mine ? "+" : ""}${fmt((keyStat(next[1]) / mine - 1) * 100, 0)}%)` : ""} at max level.</p>`;
  else tip += `<p class="note" style="margin:0 0 10px">This is the top tier for ${esc(cl.n.toLowerCase())}.</p>`;
  const rows = tiers.map(t => `<div class="step2">${tierPill(t)}<div class="grid-items">${byT[t].slice(0, 4).map(([pid, po]) => `<button class="gi${pid === id ? " me" : ""}" data-go="item:${esc(pid)}">${icon(po.i, "s22", po.n)}${esc(po.n)}<span class="x">${fmt(keyStat(po), 0)}</span></button>`).join("")}${byT[t].length > 4 ? `<span class="dim" style="font-size:12px">+${byT[t].length - 4}</span>` : ""}</div></div>`).join("");
  return `<div class="card"><h3>Upgrade path <span class="aside">${esc(cl.n)} by tier · ${label} at max level</span></h3>${tip}<div class="path">${rows}</div></div>`;
}

// What one entry costs: crafting it (if not made yet) plus every upgrade up to the target level.
function entryCost(e){
  const mats = {}, st = [];
  const add = (it, a) => { if (a > 0) mats[it] = (mats[it] || 0) + a; };
  if (e.k === "piece"){
    const p = D.pieces[e.id];
    if (!p) return {mats, st};
    for (const [it, a] of p.r) add(it, a * e.n);
    if (p.s) st.push([p.s, 1]);
    return {mats, st};
  }
  const o = D.items[e.id], r = (RBI[e.id] || [])[0];
  if (!o || !r) return {mats, st, none:true};
  const mq = maxQ(o), to = Math.min(e.to || 1, mq), from = Math.min(e.from || 0, to);
  const crafts = Math.ceil(e.n / (r.a || 1));
  for (let q = Math.max(1, from + 1); q <= to; q++){
    for (const req of r.r){ const a = recipeAmount(r, req, q); if (a) add(req[0], a * (q === 1 ? crafts : e.n)); }
  }
  if (r.s && to > from) st.push([r.s, stationLevel(r, to)]);
  return {mats, st};
}
// Gathered things stay raw; anything crafted, smelted or brewed breaks down into what goes in. Loot from
// breaking pots and props doesn't count as a way to gather (bars turn up there, but rarely).
const GATHER = new Set(["mine","chop","pick","drop","fish"]);
function makePlan(id){
  if ((D.sources[id] || []).some(s => GATHER.has(s.k))) return null;
  const r = (RBI[id] || [])[0];
  if (r) return {k:"craft", st:r.s, out:r.a || 1, ins:r.r.map(q => [q[0], recipeAmount(r, q, 1)]).filter(x => x[1] > 0)};
  const convs = (PROD[id] || []).filter(c => !["plant","incinerator","incineratorDefault"].includes(c.k) && c.in.length);
  if (!convs.length) return null;
  const rank = c => Math.max(...c.in.map(x => (D.items[x[0]] || {}).tier ?? 9));
  const c = convs.slice().sort((a, b) => rank(a) - rank(b))[0];
  const ins = c.in.map(x => [x[0], x[1]]);
  if (c.fuel) ins.push([c.fuel, c.fp || 1]);
  return {k:c.k, st:c.st, out:(c.out.find(x => x[0] === id) || [id, 1])[1] || 1, ins};
}
function breakdown(mats){
  let need = {...mats};
  const steps = [], done = new Set();
  for (let pass = 0; pass < 8; pass++){
    const exp = Object.keys(need).filter(id => !done.has(id) && makePlan(id));
    if (!exp.length) break;
    const next = {};
    for (const [id, a] of Object.entries(need)) if (!exp.includes(id)) next[id] = (next[id] || 0) + a;
    for (const id of exp){
      const p = makePlan(id), runs = Math.ceil(need[id] / p.out);
      done.add(id);
      steps.push({id, n:runs * p.out, runs, k:p.k, st:p.st, pass});
      for (const [x, q] of p.ins) next[x] = (next[x] || 0) + q * runs;
    }
    need = next;
  }
  return {raw:need, steps};
}
const VERB = {craft:"Craft", smelter:"Smelt", cooking:"Cook", fermenter:"Ferment", sap:"Collect", beehive:"Collect"};
function listTotals(){
  const mats = {}, st = {};
  for (const e of S.list){
    const c = entryCost(e);
    for (const [it, a] of Object.entries(c.mats)) mats[it] = (mats[it] || 0) + a;
    for (const [s, l] of c.st) st[s] = Math.max(st[s] || 0, l);
  }
  let steps = [];
  let out = mats;
  if (S.listRaw){ const b = breakdown(mats); out = b.raw; steps = b.steps; for (const s of steps) if (s.st) st[s.st] = Math.max(st[s.st] || 0, 1); }
  return {mats:out, st, steps};
}

const EL_SLOTS = [
  ["weapons", "Melee weapons", t => ["OneHandedWeapon","TwoHandedWeapon","TwoHandedWeaponLeft"].some(x => t.includes(x))],
  ["bows", "Bows & crossbows", t => ["Bow","Bows","Crossbows"].some(x => t.includes(x))],

  ["utility", "Belts & utility", t => t.includes("Utility")],
  ["trinket", "Trinkets", t => t.includes("Trinket")],
  ["tools", "Tools & torches", t => t.includes("Tool") || t.includes("Torch")],
];
const TYPE_LABEL = {OneHandedWeapon:"One-handed", TwoHandedWeapon:"Two-handed", TwoHandedWeaponLeft:"Two-handed", Bow:"Bows", Bows:"Bows", Crossbows:"Crossbows", Staff:"Staffs",
  Shield:"Shields", Helmet:"Helmets", Chest:"Chest", Legs:"Legs", Shoulder:"Capes", Utility:"Belts", Trinket:"Trinkets", Tool:"Tools", Torch:"Torches"};
const SKILL_LABEL = {Swords:"swords", Knives:"knives", Clubs:"clubs", Polearms:"atgeirs", Spears:"spears", Axes:"axes", Bows:"bows", Crossbows:"crossbows", Unarmed:"fists",
  Pickaxes:"pickaxes", ElementalMagic:"elemental staffs", BloodMagic:"blood magic", Blocking:"shields", WoodCutting:"axes"};
const SHARD_COLOR = {Red:"#d9534f", Yellow:"#e3c84b", Cyan:"#45c9d6", Orange:"#f0913a", Pink:"#ee7fb8", Black:"#2a2a2e", White:"#f2f2f2", Green:"#5fb760", Purple:"#9a6ad6",
  Grey:"#9a9a9a", DarkRed:"#8b1e1e", DarkGreen:"#2f6b3a", DarkBlue:"#2a4a8b", DarkPurple:"#5b2e7a", Golden:"#d4a72c", LightBlue:"#8fd0f0", LightGreen:"#a5e08a", Peach:"#f3b58c"};
const SHARD_SLOTS = ["MeleeWeapon","RangedWeapon","MagicWeapon","Shield","Head","Chest","Legs","Shoulders","Utility","Trinket"];
function slotsOf(f){
  const t = f.t || [];
  if (!t.length) return ["any"];
  return EL_SLOTS.filter(s => s[2](t)).map(s => s[0]);
}
function goesOn(f){
  let out = f.t && f.t.length ? [...new Set(f.t.map(t => TYPE_LABEL[t] || prettify(t)))] : ["Any gear"];
  if (f.only) out = f.only.map(iname);
  return out;
}
function limitsOf(f){
  const bits = [];
  if (f.sk) bits.push("Only " + f.sk.map(s => SKILL_LABEL[s] || prettify(s)).join(", "));
  if (f.xsk) bits.push("Not on " + f.xsk.map(s => SKILL_LABEL[s] || prettify(s)).join(", "));
  if (f.xt) bits.push("Not on " + f.xt.map(t => TYPE_LABEL[t] || prettify(t)).join(", "));
  if (f.ra) bits.push("Only " + f.ra.join(", ") + " rarity");
  for (const n of f.need || []) bits.push("Needs: " + n);
  if (f.must) bits.push("Needs the " + f.must.map(fxName).join(" or ") + " enchantment first");
  return bits;
}
const fxName = t => (D.enchant && (D.enchant.names[t] || (D.enchant.fx[t] || {}).n)) || prettify(t);
function rangeText(f, i){
  if (!f.v) return i === 0 ? `<span class="dim">on/off</span>` : "";
  const r = f.v[i];
  if (!r || (f.ra && !f.ra.includes(RAR[i]))) return dash;
  return `<span class="rv" style="color:var(${RARITY_VAR[i]})">${r[0] === r[1] ? fmt(r[0], 1) : fmt(r[0], 1) + "–" + fmt(r[1], 1)}</span>`;
}
const weightWord = w => w >= 10 ? "common" : w >= 5 ? "uncommon" : w >= 2 ? "rare" : "very rare";
function fxFits(f, id, o){
  const t = o.t, sk = o.skid || "";
  if (!t || !ANY_GEAR.includes(t) && !(sk === "ElementalMagic" || sk === "BloodMagic")) return false;
  const staff = sk === "ElementalMagic" || sk === "BloodMagic";
  const types = f.t && f.t.length ? f.t : null;
  if (types && !(types.includes(t) || (staff && types.includes("Staff")) || (sk === "Bows" && types.includes("Bows")) || (sk === "Crossbows" && types.includes("Crossbows")))) return false;
  if (f.xt && f.xt.includes(t)) return false;
  if (f.sk && !f.sk.includes(sk)) return false;
  if (f.xsk && f.xsk.includes(sk)) return false;
  if (f.only && !f.only.includes(id)) return false;
  const q = o.q ? o.q[o.q.length - 1] : {}, x = o.x || {}, d = q.dmg || {};
  for (const n of f.need || []){
    if (n === "item has armor" && !q.arm) return false;
    if (n === "item can block" && !q.blk) return false;
    if (n === "weapon deals physical damage" && !(d.slash || d.pierce || d.blunt)) return false;
    if (n === "weapon deals elemental damage" && !(d.fire || d.frost || d.lightning || d.poison || d.spirit)) return false;
    if (n === "attacks cost eitr" && !(o.atk && o.atk.eitr)) return false;
    if (n === "attacks cost health" && !(o.atk && (o.atk.hp || o.atk.hpPct))) return false;
    if (n === "attacks cost stamina" && !(o.atk && o.atk.stam)) return false;
    if (n === "item slows you down" && !(x.move < 0)) return false;
    if (n === "item has durability" && !q.dur) return false;
    if (n === "weapon deals chop damage" && !d.chop) return false;
    if (n === "weapon has a backstab bonus" && !x.backstab) return false;
    if (n === "item can parry" && !(x.parry > 1)) return false;
    if (n === "item can't parry" && x.parry > 1) return false;
  }
  return true;
}

  if (t === "Bow" || sk === "Bows" || sk === "Crossbows") return "bows";

  steps.push(["Convert materials", `<p>Upgrade five of one rarity into one of the next, turn shards into dust, essence or reagent, and rebuild trophies from their drops.</p>
    <div class="fold${closed ? " closed" : ""}" data-sec-key="${key}"><div class="fold-h" data-toggle="${key}" role="button" tabindex="0" aria-expanded="${!closed}">${CHEV}All ${E.conv.length} conversions</div><div class="fold-b">
    ${[["Upgrades", up], ["Shards to materials", cv], ["Rebuild trophies and runestones", junk]].filter(x => x[1].length).map(([n, l]) => `<div class="lvlhead">${n}</div><div style="overflow-x:auto"><table class="wtable"><tbody>${l.map(convRow).join("")}</tbody></table></div>`).join("")}</div></div>`]);
  return `<div class="panel"><div class="steps">${steps.map(([t, b], i) => `<div class="step"><span class="n">${i + 1}</span><div><h3>${esc(t)}</h3>${b}</div></div>`).join("")}</div></div>`;
}
function legendaryView(){
  const E = D.enchant;
  const setById = Object.fromEntries(E.sets.map(s => [s.id, s]));
  const cards = E.leg.map(l => `<div class="legcard${l.k === "Mythic" ? " mythic" : ""}"><h3>${esc(l.n)}</h3><div class="pillset">${(l.only ? l.only.map(iname) : (l.sk.length ? l.sk.map(s => SKILL_LABEL[s] || s) : l.t.map(t => TYPE_LABEL[t] || t))).map(x => `<span class="pill">${esc(x)}</span>`).join("")}${l.set ? `<span class="pill good">${esc(setById[l.set] ? setById[l.set].n : l.set)} set</span>` : ""}</div>
    ${l.d ? `<p>${esc(l.d)}</p>` : ""}${l.fx.length ? `<div class="lvlhead" style="margin-top:4px">Always has</div><div class="grid-items">${l.fx.map(t => D.enchant.fx[t] ? `<button class="gi" data-go="ench:${esc(t)}">${esc(fxName(t))}</button>` : `<span class="gi" style="cursor:default">${esc(fxName(t))}</span>`).join("")}</div>` : ""}</div>`).join("");
  const sets = E.sets.map(s => `<div class="panel"><h2>${esc(s.n)} set</h2><p class="tip">${esc(s.items.map(id => (E.leg.find(l => l.id === id) || {}).n || id).join(", "))}</p><ul class="effects">${s.bonus.map(b => `<li><b>${b.n} pieces:</b> ${esc(fxName(b.fx))}${b.v ? " " + fmt(b.v, 0) : ""}</li>`).join("")}</ul></div>`).join("");
  return `<p class="note" style="margin:0 0 12px">Legendary items are named uniques that drop or come out of an enchant at Legendary rarity, always with the effects listed. ${E.sets.length ? "Pieces of a set add bonuses when worn together." : ""}</p><div class="grid3">${cards}</div>${sets ? `<div class="headrow" style="margin-top:20px"><h2>Sets</h2></div><div class="grid2">${sets}</div>` : ""}`;
}
function shardView(){
  const E = D.enchant, slotLab = k => E.slots[k.toLowerCase()] || prettify(k);
  const core = E.shards.filter(s => Object.keys(s.fx).length), other = E.shards.filter(s => !Object.keys(s.fx).length);
  const cell = (s, slot) => {
    const e = s.fx[slot];
    if (!e) return `<td>${dash}</td>`;
    const [t, vals] = e;
    const nums = (vals || []).filter(v => v != null);
    const range = nums.length && typeof nums[0] === "number" ? fmt(nums[0], 1) + (nums.length > 1 ? "–" + fmt(nums[nums.length - 1], 1) : "") : "";
    const tip = (E.descs[t] || (E.fx[t] || {}).d || "").replace(/\{0\}/g, "X");
    return `<td title="${esc(tip)}">${E.fx[t] ? `<button class="lnk" data-go="ench:${esc(t)}">${esc(fxName(t))}</button>` : esc(fxName(t))}${range ? `<div class="rv dim">${range}</div>` : ""}</td>`;
  };
  return `<p class="note" style="margin:0 0 12px">Shardstones go into shard slots on magic gear. Each color gives a different effect depending on the slot it's in; the numbers run from Magic to Ancient quality. Hover an effect for its description.</p>
    <div class="tbl-wrap"><table><thead><tr><th>Shardstone</th>${SHARD_SLOTS.map(k => `<th style="cursor:default">${esc(slotLab(k))}</th>`).join("")}</tr></thead><tbody>${core.map(s => `<tr style="cursor:default"><td><span class="swatch" style="background:${SHARD_COLOR[s.c] || "var(--surface-3)"}"></span><b>${esc(prettify(s.c))}</b><div class="dim" style="font-size:11px">${esc(s.cat)}</div></td>${SHARD_SLOTS.map(k => cell(s, k)).join("")}</tr>`).join("")}</tbody></table></div>
    ${other.length ? `<p class="note">Boss and unique shardstones: ${esc(other.map(s => prettify(s.c) + " (" + s.ra[0] + "+)").join(", "))}.</p>` : ""}`;
}
function enchantDetail(id){
  const E = D.enchant, f = E && E.fx[id];
  if (!f) return `<div class="inner"><p style="padding:20px">Unknown enchantment.</p></div>`;
  let h = `<div class="inner">` + dhead(-6, f.n, goesOn(f).map(x => tag(x)), f.d, "Enchantment");
  if (f.v){
    h += `<div class="card"><h3>Values by rarity <span class="aside">${esc(f.f.replace(/\{\d\}/g, "X"))}</span></h3><div style="overflow-x:auto"><table class="wtable"><tbody>${RAR.map((r, i) => `<tr><td>${rarHead(i)}</td><td class="num">${rangeText(f, i)}</td></tr>`).join("")}</tbody></table></div></div>`;
  }
  const lim = limitsOf(f);
  h += `<div class="card"><h3>Goes on</h3><div class="pillset">${goesOn(f).map(x => `<span class="pill">${esc(x)}</span>`).join("")}</div>${lim.length ? `<ul class="effects">${lim.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    <p class="note">Rolls ${esc(weightWord(f.w || 1))} (weight ${f.w || 1}; most common effects have 10).</p></div>`;
  if (f.ex) h += `<div class="card"><h3>Can't roll together with</h3><div class="grid-items">${f.ex.map(t => E.fx[t] ? `<button class="gi" data-go="ench:${esc(t)}">${esc(fxName(t))}</button>` : `<span class="gi" style="cursor:default">${esc(fxName(t))}</span>`).join("")}</div></div>`;
  const legs = E.leg.filter(l => l.fx.includes(id));
  if (legs.length) h += `<div class="card"><h3>Always on these legendaries</h3><div class="grid-items">${legs.map(l => `<span class="gi" style="cursor:default">${esc(l.n)}</span>`).join("")}</div></div>`;
  const shards = [];
  for (const s of E.shards) for (const [slot, e] of Object.entries(s.fx)) if (e[0] === id) shards.push(`${prettify(s.c)} in ${(E.slots[slot.toLowerCase()] || prettify(slot)).toLowerCase()}`);
  if (shards.length) h += `<div class="card"><h3>Also from shardstones</h3><p style="margin:0">${esc(shards.join(", "))}</p></div>`;
  const now = worldStage();
  const ex = Object.entries(D.items).filter(([iid, o]) => o.tier != null && o.tier <= now && !o.ns && RBI[iid] && fxFits(f, iid, o)).sort((a, b) => b[1].tier - a[1].tier || keyStat(b[1]) - keyStat(a[1])).slice(0, 8);
  if (ex.length) h += `<div class="card"><h3>Gear you can make now that takes it</h3><div class="grid-items">${ex.map(([iid, o]) => `<button class="gi" data-go="item:${esc(iid)}">${icon(o.i, "s22", o.n)}${esc(o.n)}</button>`).join("")}</div></div>`;
  return h + `</div>`;
}
function enchantCard(id, o){
  const E = D.enchant;
  if (!E) return "";
  const fits = Object.entries(E.fx).filter(([k, f]) => fxFits(f, id, o)).sort((a, b) => (b[1].w || 1) - (a[1].w || 1) || a[1].n.localeCompare(b[1].n));
  if (!fits.length) return "";
  const slot = slotOfItem(o);
  const key = "ench:" + id, lim = S.open[key] ? 1e9 : 16;
  const type = o.t === "Bow" || ["OneHandedWeapon","TwoHandedWeapon","TwoHandedWeaponLeft","Tool","Torch"].includes(o.t) || (o.skid === "ElementalMagic" || o.skid === "BloodMagic") ? "OneHandedWeapon" : "Chest";
  return `<div class="card"><h3>Enchanting <span class="aside">${fits.length} effects can roll on it</span></h3>
    <div class="grid-items">${fits.slice(0, lim).map(([k, f]) => `<button class="gi" data-go="ench:${esc(k)}">${esc(f.n)}</button>`).join("")}${fits.length > lim ? `<button class="gi" data-more="${esc(key)}">+${fits.length - lim} more</button>` : ""}</div>
    <div style="overflow-x:auto;margin-top:10px"><table class="wtable"><tbody>${[0, 1, 2].map(i => `<tr><td>${rarHead(i)}</td><td>${costChips(costFor(E.cost.enchant, type, RAR[i]))}</td></tr>`).join("")}</tbody></table></div>
    <p class="note">Enchanting cost at the Enchanting Table (higher rarities follow the same pattern). <button class="lnk" data-view="enchant" data-eslot="${esc(slot)}">All enchantments for this slot</button></p></div>`;
}

// ---------- detail router
function helpDetail(){
  const n = Object.keys(D.items).length;
  return `<div class="inner help">${dhead(-5, "How to read the atlas", [], "", "Guide")}<div class="card">
    <p>Search for a weapon type, an item, a material, a station, a creature or an enchantment. <b>Greatsword</b> lists every greatsword side by side. <b>Iron</b> shows iron and everything named after it. Click any row or icon to open it here.</p>
    <p><b>Tiers</b> place everything in the boss order, from Meadows to Deep North. A material's tier is the earliest biome you can gather it in with a tool you can make; crafted things take their latest ingredient, station and station upgrade. Use the tier filter to see only what you can make now.</p>
    <p><b>Stations and levels.</b> A crafting station starts at level 1. Each different upgrade you build in range adds a level. The level badge is what you need to craft the item.</p>
    <p><b>Item levels (★).</b> ★1 is the crafted item. Each upgrade costs the materials shown and needs a higher station level. The upgrade table shows the tier each star becomes reachable.</p>
    <p><b>Damage</b> is the weapon's base damage added up across types. Your skill in that weapon decides how much of it lands.</p>
    <p><b>Journey</b> walks the boss order for your class. <b>Enchanting</b> covers Epic Loot. <b>World settings</b> lets you try other world options; health, damage, drops and raid timing across the atlas follow what you pick.</p>
    <p class="dim">${n.toLocaleString()} items across ${D.modsUsed.length} sources, including vanilla Valheim.</p></div></div>`;
}
function renderDetail(){
  const s = S.sel;
  let h;
  if (!s || s.k === "help") h = helpDetail();
  else if (s.k === "item") h = itemDetail(s.id);
  else if (s.k === "piece") h = pieceDetail(s.id);
  else if (s.k === "station") h = stationDetail(s.id);
  else if (s.k === "creature") h = creatureDetail(s.id);
  else if (s.k === "boss") h = bossDetail(s.id);
  else if (s.k === "event") h = eventDetail(s.id);
  else if (s.k === "loc") h = locationDetail(s.id);
  else if (s.k === "biome") h = biomeDetail(s.id);
  else if (s.k === "ench") h = enchantDetail(s.id);
  else h = helpDetail();
  // Jump links for long pages: one per card heading.
  let n = 0;
  const labels = [];
  h = h.replace(/<div class="card"><h3>([^<]*)/g, (m, t) => { const id = "dc" + (n++); labels.push([id, t.trim()]); return `<div class="card" id="${id}"><h3>${t}`; });
  h = h.replace("<!--DNAV-->", labels.length >= 4 ? `<nav class="dnav" aria-label="Sections">${labels.map(([id, t]) => `<button data-jump="${id}">${t}</button>`).join("")}</nav>` : "");
  const d = $("#detail");
  d.innerHTML = h;
  d.scrollTop = 0;
}

// ---------- events
function wire(){
  const q = $("#q");
  let t;
  q.addEventListener("input", () => {
    clearTimeout(t);
    t = setTimeout(() => {
      const had = !!S.q;
      S.q = q.value.trim();
      if (S.q && !had){ S.prevView = S.view; S.view = "search"; S.cls = null; window.scrollTo(0, 0); }
      if (!S.q && had){ if (S.view === "search") S.view = S.prevView || "home"; S.cls = null; }
      S.open = {};
      render();
    }, 110);
  });
  document.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement !== q && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){ e.preventDefault(); q.focus(); q.select(); }
    if (e.key === "Escape"){
      if (document.activeElement === q && q.value){ q.value = ""; q.dispatchEvent(new Event("input")); }
      else if ($("#nav").classList.contains("open")) closeNav();
      else if (S.sel) closeDetail();
    }
    if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("[role=button][data-go]")){ e.preventDefault(); e.target.click(); }
    const h = e.target.closest && e.target.closest("[data-toggle]");
    if (h && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); toggleSection(h.dataset.toggle); }
  });
  document.addEventListener("change", e => {
    const id = e.target.id;
    if (id === "f-tier"){ S.tier = e.target.value; render(); return; }
    if (id === "f-mod"){ S.mod = e.target.value; render(); return; }
    if (id === "f-nosrc"){ S.nosrc = e.target.checked; render(); return; }
    if (id === "f-sub"){ S.cls = e.target.value || null; S.open = {}; render(); return; }
    if (id === "l-raw"){ S.listRaw = e.target.checked; saveList(); render(); return; }
    const t = e.target.dataset || {};
    if (t.got !== undefined){ if (e.target.checked) S.listGot[t.got] = 1; else delete S.listGot[t.got]; saveList(); e.target.closest("tr").classList.toggle("got", e.target.checked); return; }
    if (t.lf !== undefined || t.lt !== undefined || t.ln !== undefined){
      const en = S.list[+(t.lf ?? t.lt ?? t.ln)];
      if (!en) return;
      if (t.lf !== undefined){ en.from = +e.target.value; if (en.to <= en.from) en.to = Math.min(en.from + 1, maxQ(D.items[en.id])); }
      if (t.lt !== undefined){ en.to = +e.target.value; if (en.from >= en.to) en.from = en.to - 1; }
      if (t.ln !== undefined) en.n = Math.max(1, Math.round(+e.target.value || 1));
      saveList(); const sy = window.scrollY; render(); window.scrollTo(0, sy); return;
    }
    if (e.target.matches && e.target.matches("[data-comfort],[data-comfort-u],#comfort-roof")) updateComfort();
  });
  document.addEventListener("input", e => {
    if (e.target.id === "w-players"){ W.players = +e.target.value; store("atlas.players", String(W.players)); worldChanged(); }
  });
  document.addEventListener("click", e => {
    const el = e.target.closest("[data-go],[data-view],[data-cls],[data-sort],[data-more],[data-lvl],[data-back],[data-close],[data-toggle],[data-collapse],[data-w-mod],[data-w-reset],[data-progress],[data-w-night],[data-help],[data-comfort-view],[data-journey],[data-klass],[data-etab],[data-eslot],[data-jump],[data-navtoggle],[data-tier-clear],[data-filters-clear],[data-addlist],[data-rmlist],[data-lrm],[data-add],[data-copylist],[data-clearlist]");
    if (!el) return;
    if (el.dataset.addlist){
      const i = el.dataset.addlist.indexOf(":");
      listAdd(el.dataset.addlist.slice(0, i), el.dataset.addlist.slice(i + 1), ($("#al-to") || {}).value, ($("#al-n") || {}).value);
      const sc = $("#detail").scrollTop; renderDetail(); $("#detail").scrollTop = sc; renderNav(navCounts()); if (S.view === "list") render();
      return;
    }
    if (el.dataset.rmlist){
      const i = el.dataset.rmlist.indexOf(":");
      listRemove(el.dataset.rmlist.slice(0, i), el.dataset.rmlist.slice(i + 1));
      const sc = $("#detail").scrollTop; renderDetail(); $("#detail").scrollTop = sc; renderNav(navCounts()); if (S.view === "list") render();
      return;
    }
    if (el.dataset.add){
      const parts = el.dataset.add.split(",").filter(Boolean);
      for (const p of parts){ const [id, q] = p.split("@"); listAdd("item", id, +q || undefined, 1, true); }
      toast(`Added ${parts.length} item${parts.length > 1 ? "s" : ""} to your shopping list.`);
      renderNav(navCounts());
      return;
    }
    if (el.dataset.lrm !== undefined){ S.list.splice(+el.dataset.lrm, 1); saveList(); render(); return; }
    if (el.hasAttribute("data-clearlist")){
      if (el.dataset.confirm !== "1"){ el.dataset.confirm = "1"; el.textContent = "Click again to clear"; setTimeout(() => { if (el.isConnected){ el.dataset.confirm = ""; el.textContent = "Clear list"; } }, 3000); return; }
      S.list = []; S.listGot = {}; saveList(); render(); return;
    }
    if (el.hasAttribute("data-copylist")){
      const text = listText(), box = $("#l-text");
      const fallback = () => { if (box){ box.hidden = false; box.value = text; box.focus(); box.select(); } };
      try{ navigator.clipboard.writeText(text).then(() => toast("Copied your shopping list."), fallback); }catch(err){ fallback(); }
      return;
    }
    if (el.hasAttribute("data-navtoggle")){ $("#nav").classList.contains("open") ? closeNav() : openNav(); return; }
    if (el.dataset.toggle){ toggleSection(el.dataset.toggle); return; }
    if (el.dataset.jump){ const c = document.getElementById(el.dataset.jump); if (c) c.scrollIntoView({block:"start", behavior:matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); return; }
    if (el.dataset.collapse){
      const on = el.dataset.collapse === "1";
      document.querySelectorAll("#results [data-sec-key]").forEach(sec => { S.collapsed[sec.dataset.secKey] = on; sec.classList.toggle("closed", on); const hh = sec.querySelector("[data-toggle]"); if (hh) hh.setAttribute("aria-expanded", String(!on)); });
      saveCollapsed(); return;
    }
    if (el.dataset.progress !== undefined){ W.stage = +el.dataset.progress; worldChanged(); return; }
    if (el.dataset.wMod){ W.opt[el.dataset.wMod] = el.dataset.wOpt; worldChanged(); return; }
    if (el.hasAttribute("data-w-reset")){ Object.assign(W.opt, W.base); worldChanged(); return; }
    if (el.dataset.wNight){ W.night = el.dataset.wNight === "1"; worldChanged(); return; }
    if (el.hasAttribute("data-tier-clear")){ S.tier = "all"; render(); return; }
    if (el.hasAttribute("data-filters-clear")){ S.tier = "all"; S.mod = ""; render(); return; }
    if (el.dataset.klass !== undefined){ S.klass = el.dataset.klass || null; store("atlas.class", S.klass || ""); if (S.view !== "journey" && S.view !== "home") S.view = "journey"; if (S.view === "journey") window.scrollTo(0, 0); render(); return; }
    if (el.dataset.journey !== undefined){
      const t = +el.dataset.journey;
      go("journey");
      if (S.klass){ const key = "stage:" + S.klass + ":" + t; S.collapsed[key] = false; render(); }
      const st = document.getElementById("stage-" + t);
      if (st) st.scrollIntoView({block:"start"});
      return;
    }
    if (el.dataset.etab){ S.etab = el.dataset.etab; if (S.view !== "enchant") go("enchant"); else { render(); } return; }
    if (el.dataset.eslot !== undefined && !el.dataset.view){ S.eslot = el.dataset.eslot; render(); return; }
    if (el.dataset.view){
      const v = el.dataset.view;
      if (v === "search" && !S.q) return;
      if (el.dataset.eslot !== undefined){ S.eslot = el.dataset.eslot; S.etab = "fx"; }
      if (el.closest("#detail") && matchMedia("(max-width:1279px)").matches) closeDetail();
      go(v, el.dataset.tier !== undefined ? {tier:el.dataset.tier} : {});
      return;
    }
    if (el.dataset.cls !== undefined){ S.cls = el.dataset.cls || null; S.open = {}; render(); return; }
    if (el.dataset.sort){
      const key = el.dataset.sec, c = el.dataset.sort;
      const g = key.split(":")[1];
      const cur = S.sort[key] || S.sort[g] || DEFAULT_SORT[g] || [];
      const dir = cur[0] === c ? -cur[1] : (col[c].n ? -1 : 1);
      S.sort[key] = [c, dir]; S.sort[g] = [c, dir];
      render(); return;
    }
    if (el.dataset.more){ S.open[el.dataset.more] = true; if (el.closest("#detail")) { const sc = $("#detail").scrollTop; renderDetail(); $("#detail").scrollTop = sc; } else render(); return; }
    if (el.dataset.lvl){ S.lvl = +el.dataset.lvl; const sc = $("#detail").scrollTop; renderDetail(); $("#detail").scrollTop = sc; return; }
    if (el.hasAttribute("data-back")){ const p = S.hist.pop(); if (p) select(p.k, p.id, "back"); return; }
    if (el.hasAttribute("data-close")){ closeDetail(); return; }
    if (el.hasAttribute("data-help")){ showHelp(); return; }
    if (el.hasAttribute("data-comfort-view")){ if (matchMedia("(max-width:1279px)").matches) closeDetail(); go("comfort"); return; }
    if (el.dataset.go){
      e.preventDefault();
      const i = el.dataset.go.indexOf(":");
      select(el.dataset.go.slice(0, i), el.dataset.go.slice(i + 1), el.closest("#detail") ? "link" : "fresh");
    }
  });
  window.addEventListener("hashchange", () => { fromHash(); if (S.sel) renderDetail(); });
}
function saveCollapsed(){ store("atlas.collapsed", JSON.stringify(S.collapsed)); }
function toggleSection(key){
  const sec = [...document.querySelectorAll("#results [data-sec-key]")].find(x => x.dataset.secKey === key);
  const wasClosed = sec ? sec.classList.contains("closed") : !!S.collapsed[key];
  S.collapsed[key] = !wasClosed;
  if (sec){ sec.classList.toggle("closed", !!S.collapsed[key]); const hh = sec.querySelector("[data-toggle]"); if (hh) hh.setAttribute("aria-expanded", String(!S.collapsed[key])); }
  saveCollapsed();
}
function worldChanged(){
  saveWorld();
  const sy = window.scrollY, dy = $("#detail").scrollTop;
  renderWorldBtn();
  render();
  if (S.sel) renderDetail();
  window.scrollTo(0, sy);
  $("#detail").scrollTop = dy;
}
boot();
})();
</script>

</body></html>
