<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="description" content="Searchable Valheim crafting atlas: recipes, upgrade costs, stats, building pieces, stations and material sources for a modded profile."></head><body>
<title>Valheim Crafting Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Averia+Sans+Libre:wght@400;700&family=Averia+Serif+Libre:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#13110e; --surface:#1c1814; --surface-2:#241f19; --surface-3:#2d271f;
  --line:#3b3229; --line-soft:#2b251e;
  --text:#ede1c9; --muted:#a8977c; --faint:#77695a;
  --accent:#eea43f; --accent-soft:rgba(238,164,63,.14); --accent-ink:#1b1207; --link:#f3b865;
  --frost:#86c3dc; --good:#9cc46a; --bad:#e56a4c; --warn:#e4c25a;
  --d-slash:#cfd3d8; --d-pierce:#c4ad84; --d-blunt:#a8977c; --d-fire:#ea6f3c; --d-frost:#86c9ee; --d-lightning:#ecd54e;
  --d-poison:#95c955; --d-spirit:#c8b6ff; --d-damage:#f1ece2; --d-chop:#b98246; --d-pickaxe:#8f96a3;
  --shadow:0 18px 40px rgba(0,0,0,.45);
  --serif:"Averia Serif Libre", Georgia, "Times New Roman", serif;
  --sans:"Averia Sans Libre", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --bg:#e8e6e1; --surface:#f6f5f1; --surface-2:#eeebe5; --surface-3:#e4e0d8;
    --line:#cdc6b8; --line-soft:#dfd9ce;
    --text:#221c15; --muted:#6a5f4e; --faint:#958a78;
    --accent:#b2630d; --accent-soft:rgba(178,99,13,.12); --accent-ink:#fff8ee; --link:#9a5208;
    --frost:#2c6c88; --good:#4e7c1f; --bad:#b33b21; --warn:#8a6a08;
    --d-slash:#5d646e; --d-pierce:#8a6d3b; --d-blunt:#6f604b; --d-fire:#c9471a; --d-frost:#2f86b3; --d-lightning:#a88d0a;
    --d-poison:#4f8a1c; --d-spirit:#6f55c9; --d-damage:#3b342b; --d-chop:#8a5a26; --d-pickaxe:#5b6270;
    --shadow:0 18px 40px rgba(40,30,15,.18);
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#e8e6e1; --surface:#f6f5f1; --surface-2:#eeebe5; --surface-3:#e4e0d8;
  --line:#cdc6b8; --line-soft:#dfd9ce;
  --text:#221c15; --muted:#6a5f4e; --faint:#958a78;
  --accent:#b2630d; --accent-soft:rgba(178,99,13,.12); --accent-ink:#fff8ee; --link:#9a5208;
  --frost:#2c6c88; --good:#4e7c1f; --bad:#b33b21; --warn:#8a6a08;
  --d-slash:#5d646e; --d-pierce:#8a6d3b; --d-blunt:#6f604b; --d-fire:#c9471a; --d-frost:#2f86b3; --d-lightning:#a88d0a;
  --d-poison:#4f8a1c; --d-spirit:#6f55c9; --d-damage:#3b342b; --d-chop:#8a5a26; --d-pickaxe:#5b6270;
  --shadow:0 18px 40px rgba(40,30,15,.18);
}
:root[data-theme="dark"]{ color-scheme: dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0; color:var(--text); font-family:var(--sans); font-size:14px; line-height:1.45; padding-inline:16px; padding-block:0 40px}
button{font:inherit; color:inherit}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
.wrap{max-width:1500px; margin:0 auto}

/* header */
.top{display:grid; grid-template-columns:auto minmax(0,1fr); gap:14px 28px; align-items:center; padding-block:22px 14px}
.brand{display:flex; gap:12px; align-items:center; min-width:0}
.brand svg{flex:none; color:var(--accent)}
.brand h1{font-family:var(--serif); font-weight:700; font-size:26px; line-height:1.05; margin:0; letter-spacing:.01em; text-wrap:balance}
.brand p{margin:3px 0 0; color:var(--muted); font-size:12.5px}
.search{position:relative; display:flex; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding-inline:12px; min-height:46px}
.search:focus-within{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{flex:none; color:var(--muted)}
.search input{flex:1; min-width:0; border:0; background:transparent; color:var(--text); font:inherit; font-size:16px; padding:10px 10px; outline:none}
.search input::placeholder{color:var(--faint)}
.search kbd{font-family:var(--mono); font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:5px; padding:1px 6px}
@media (max-width:760px){ .top{grid-template-columns:1fr} .search kbd{display:none} }

/* chip rows */
.chips{display:flex; flex-wrap:wrap; gap:6px; padding-block:4px}
.chip{border:1px solid var(--line); background:var(--surface); color:var(--text); border-radius:999px; padding:5px 12px; cursor:pointer; font-size:13px; display:inline-flex; gap:6px; align-items:center; white-space:nowrap}
.chip:hover{border-color:var(--accent)}
.chip .ct{font-family:var(--mono); font-size:11px; color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.chip[aria-pressed="true"] .ct{color:var(--accent-ink); opacity:.8}
.chips.sub .chip{font-size:12.5px; padding:4px 10px; background:transparent}
.chips.sub .chip[aria-pressed="true"]{background:var(--accent-soft); color:var(--text); border-color:var(--accent)}
.chips.sub .chip[aria-pressed="true"] .ct{color:var(--muted)}
.bar-row{display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; padding-block:8px 12px; color:var(--muted); font-size:12.5px; border-bottom:1px solid var(--line-soft); margin-bottom:14px}
.bar-row label{display:inline-flex; gap:6px; align-items:center; cursor:pointer}
.bar-row select{font:inherit; color:var(--text); background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:4px 8px}
.bar-row .spacer{flex:1}

/* layout */
.layout{display:grid; grid-template-columns:minmax(0,1fr) minmax(340px,420px); gap:20px; align-items:start}
@media (max-width:1100px){ .layout{grid-template-columns:minmax(0,1fr)} }

/* sections & tables */
.sec{margin-bottom:26px}
.sec-h{display:flex; align-items:baseline; gap:10px; margin:0 0 8px}
.sec-h h2{font-family:var(--serif); font-size:19px; margin:0; font-weight:700; text-wrap:balance}
.sec-h .ct{font-family:var(--mono); color:var(--muted); font-size:12px}
.sec-h .note{color:var(--faint); font-size:12px}
.tbl-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:var(--surface)}
table{border-collapse:collapse; width:100%; font-size:13px}
th{position:sticky; top:0; background:var(--surface-2); text-align:left; font-weight:700; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding:8px 8px; border-bottom:1px solid var(--line); white-space:nowrap; cursor:pointer; user-select:none}
th:hover{color:var(--text)}
th .sa{opacity:.9; color:var(--accent)}
th.num, td.num{text-align:right}
td{padding:7px 8px; border-bottom:1px solid var(--line-soft); vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tbody tr.on td{background:var(--accent-soft)}
td.num, .mono{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:12.5px}
.more{display:block; width:100%; text-align:center; padding:8px; background:var(--surface-2); border:0; border-top:1px solid var(--line-soft); color:var(--link); cursor:pointer; font-size:12.5px; border-radius:0 0 10px 10px}
.more:hover{background:var(--surface-3)}

.nm{display:flex; gap:10px; align-items:center; min-width:180px}
.nm b{font-family:var(--serif); font-weight:700; font-size:14px; display:block; line-height:1.2}
.nm small{color:var(--muted); font-size:11.5px; display:block}
.tag{display:inline-block; font-size:10.5px; letter-spacing:.04em; padding:0 6px; border-radius:4px; border:1px solid var(--line); color:var(--muted); line-height:16px; vertical-align:1px}
.tag.mod{border-color:transparent; background:var(--surface-3)}
.tag.boss{background:var(--bad); color:#fff; border-color:transparent}
.tag.warn{color:var(--warn); border-color:currentColor}

/* icons */
.ic{--s:28px; flex:none; display:inline-block; width:var(--s); height:var(--s); background-image:var(--icons); background-repeat:no-repeat;
  background-size:calc(var(--cols) * var(--s)) auto; background-position:calc(var(--x) * var(--s) * -1) calc(var(--y) * var(--s) * -1)}
.ic.none{background:var(--surface-3); border-radius:6px; display:inline-grid; place-items:center; color:var(--faint); font-family:var(--serif); font-size:calc(var(--s) * .5)}
.glyph{flex:none; display:inline-grid; place-items:center; width:var(--g); height:var(--g); border-radius:6px; background:var(--surface-3); color:var(--muted)}
.glyph svg{width:62%; height:62%}
.ic.s18{--s:18px} .ic.s22{--s:22px} .ic.s36{--s:36px} .ic.s56{--s:56px}

.st{display:inline-flex; align-items:center; gap:6px; white-space:nowrap}
.st em{font-style:normal; font-family:var(--mono); font-size:11.5px; color:var(--accent); border:1px solid var(--accent-soft); background:var(--accent-soft); border-radius:4px; padding:0 5px}
.st.hand{color:var(--muted)}
.dim{color:var(--faint)}
.mats{display:flex; flex-wrap:wrap; gap:3px 6px; min-width:110px; max-width:230px}
.mat{display:inline-flex; align-items:center; gap:2px; border:0; background:none; padding:0; cursor:pointer; color:var(--text)}
.mat b{font-family:var(--mono); font-weight:500; font-size:11.5px}
.mat:hover b{color:var(--link)}

.dmg{display:grid; grid-template-columns:auto; gap:3px; justify-items:end; min-width:96px}
.dmg .nums{white-space:nowrap}
.dmg .nums .arr{color:var(--faint); margin:0 3px}
.dmg .nums .mx{color:var(--text); font-weight:500}
.dbar{display:flex; height:6px; width:100%; max-width:150px; border-radius:3px; overflow:hidden; background:var(--surface-3)}
.dbar i{display:block; height:100%}
.d-slash{background:var(--d-slash)} .d-pierce{background:var(--d-pierce)} .d-blunt{background:var(--d-blunt)} .d-fire{background:var(--d-fire)}
.d-frost{background:var(--d-frost)} .d-lightning{background:var(--d-lightning)} .d-poison{background:var(--d-poison)} .d-spirit{background:var(--d-spirit)}
.d-damage{background:var(--d-damage)} .d-chop{background:var(--d-chop)} .d-pickaxe{background:var(--d-pickaxe)}
.dt{display:inline-flex; align-items:center; gap:5px; white-space:nowrap}
.dt::before{content:""; width:8px; height:8px; border-radius:2px; background:var(--c, var(--muted))}
.up{color:var(--good); font-size:11px; margin-left:4px}
.down{color:var(--bad); font-size:11px; margin-left:4px}

/* detail panel */
.detail{position:sticky; top:calc(env(safe-area-inset-top, 0px) + 12px); max-height:calc(100dvh - 24px); overflow:auto; background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow)}
.detail .inner{padding:18px 18px 22px}
.dhead{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:14px; align-items:start}
.dhead h2{font-family:var(--serif); font-size:24px; line-height:1.1; margin:2px 0 4px; text-wrap:balance}
.dhead .meta{display:flex; flex-wrap:wrap; gap:5px; align-items:center; color:var(--muted); font-size:12px}
.dhead .ctl{display:flex; gap:4px}
.iconbtn{border:1px solid var(--line); background:var(--surface-2); border-radius:8px; width:32px; height:32px; display:grid; place-items:center; cursor:pointer; color:var(--muted)}
.iconbtn:hover{color:var(--text); border-color:var(--accent)}
.desc{color:var(--muted); font-size:13px; margin:10px 0 0; white-space:pre-line}
.card{border-top:1px solid var(--line-soft); margin-top:16px; padding-top:14px}
.card h3{font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); margin:0 0 10px; font-weight:700; display:flex; justify-content:space-between; align-items:center; gap:8px}
.card h3 .aside{letter-spacing:0; text-transform:none; font-weight:400; color:var(--faint)}
.recipe-line{display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; margin-bottom:10px}
.reqs{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:6px}
.req{display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--line-soft); border-radius:8px; padding:5px 8px; cursor:pointer; text-align:left; min-width:0}
.req:hover{border-color:var(--accent)}
.req .q{font-family:var(--mono); font-weight:500; color:var(--accent); font-size:13px}
.req .rn{font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.levels{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden}
.levels button{border:0; background:transparent; padding:4px 10px; cursor:pointer; font-family:var(--mono); font-size:12px; color:var(--muted)}
.levels button + button{border-left:1px solid var(--line)}
.levels button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.kv{display:grid; grid-template-columns:repeat(auto-fill, minmax(135px,1fr)); gap:8px}
.kv div{background:var(--surface-2); border-radius:8px; padding:7px 9px; min-width:0}
.kv span{display:block; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.kv b{font-family:var(--mono); font-weight:500; font-size:15px}
.kv b small{font-size:11px; color:var(--muted); font-weight:400}
.dtable{width:100%; font-size:12.5px; border-collapse:collapse}
.dtable th{position:static; background:none; padding:4px 6px; font-size:10.5px; cursor:default; border-bottom:1px solid var(--line)}
.dtable td{padding:6px 6px; border-bottom:1px solid var(--line-soft); cursor:default}
.dtable tr:hover td{background:none}
.dtable .lvl{font-family:var(--mono); color:var(--accent); white-space:nowrap}
.dbreak{display:grid; gap:6px}
.dbreak .row{display:grid; grid-template-columns:86px minmax(0,1fr) 52px; gap:8px; align-items:center; font-size:12.5px}
.dbreak .track{height:8px; background:var(--surface-3); border-radius:4px; overflow:hidden}
.dbreak .track i{display:block; height:100%; border-radius:4px}
.dbreak .v{font-family:var(--mono); text-align:right}
.src{display:grid; gap:6px}
.src .it{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; align-items:center; background:var(--surface-2); border:1px solid var(--line-soft); border-radius:8px; padding:6px 9px; cursor:pointer; text-align:left}
.src .it:hover{border-color:var(--accent)}
.src .it .t{font-size:12.5px; min-width:0}
.src .it .t small{display:block; color:var(--muted); font-size:11.5px}
.src .it .r{font-family:var(--mono); font-size:12px; color:var(--muted); text-align:right; white-space:nowrap}
.src .k{font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--faint); margin:6px 0 0}
.flow{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.flow .arrow{color:var(--faint)}
.se{background:var(--surface-2); border-radius:8px; padding:9px 11px; font-size:12.5px; white-space:pre-line; border-left:3px solid var(--frost)}
.se b{font-family:var(--serif); display:block; font-size:13.5px; margin-bottom:2px}
.pillset{display:flex; flex-wrap:wrap; gap:5px}
.pill{font-size:11.5px; border-radius:999px; padding:2px 9px; background:var(--surface-3); white-space:nowrap}
.pill.good{background:color-mix(in srgb, var(--good) 20%, transparent); color:var(--good)}
.pill.bad{background:color-mix(in srgb, var(--bad) 18%, transparent); color:var(--bad)}
details.tip summary{cursor:pointer; color:var(--muted); font-size:12px}
details.tip pre{white-space:pre-wrap; font-family:var(--sans); font-size:12.5px; background:var(--surface-2); padding:10px; border-radius:8px; margin:8px 0 0; color:var(--text)}
.grid-items{display:flex; flex-wrap:wrap; gap:5px}
.gi{display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line-soft); background:var(--surface-2); border-radius:7px; padding:3px 8px 3px 4px; font-size:12px; cursor:pointer; max-width:100%}
.gi:hover{border-color:var(--accent)}
.gi span.x{font-family:var(--mono); font-size:11px; color:var(--accent)}
.lvlhead{font-family:var(--mono); font-size:11.5px; color:var(--accent); margin:10px 0 6px}
.help p{margin:0 0 10px; color:var(--muted); font-size:13px}
.help p b{color:var(--text)}
.help h2{font-family:var(--serif); margin:0 0 10px; font-size:21px}
.empty{padding:40px 16px; text-align:center; color:var(--muted); border:1px dashed var(--line); border-radius:12px}
.empty b{color:var(--text)}
.sheet-close{display:none}
@media (max-width:1100px){
  .detail{position:fixed; inset:auto 0 0 0; top:auto; max-height:88dvh; border-radius:16px 16px 0 0; z-index:20; transform:translateY(105%); transition:transform .22s ease; padding-bottom:env(safe-area-inset-bottom, 0px)}
  .detail.open{transform:none}
  .sheet-close{display:grid}
  .scrim{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:19}
}
@media (prefers-reduced-motion: reduce){ .detail{transition:none} }
.foot{color:var(--faint); font-size:12px; margin-top:30px; border-top:1px solid var(--line-soft); padding-top:14px}
.loading{padding:80px 0; text-align:center; color:var(--muted); font-family:var(--serif); font-size:18px}

/* collapsible sections */
.sec-h{cursor:pointer; user-select:none; border-radius:6px}
.sec-h .chev{flex:none; width:18px; height:18px; display:inline-grid; place-items:center; color:var(--muted); transition:transform .15s ease; align-self:center}
.sec.closed .chev{transform:rotate(-90deg)}
.sec.closed .tbl-wrap{display:none}
.sec.closed{margin-bottom:10px}
.sec-h:hover h2{color:var(--link)}
.groups-sep{align-self:center; font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--faint); margin:0 2px 0 10px}
.lnk{border:0; background:none; color:var(--link); cursor:pointer; font:inherit; font-size:12.5px; padding:0}
.lnk:hover{text-decoration:underline}
.world-now{display:flex; flex-wrap:wrap; gap:5px; align-items:center}
.world-now .pill{background:var(--surface-3); color:var(--text)}
/* world panel */
:root{--r0:#9aa3ad; --r1:#4f8fd6; --r2:#a35bd6; --r3:#e0a33a; --r4:#e0553a}
.wpanel{display:grid; gap:16px}
.wcard{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; min-width:0}
.wcard > h2{font-family:var(--serif); font-size:19px; margin:0 0 4px; text-wrap:balance}
.wcard > .tip{color:var(--muted); font-size:12.5px; margin:0 0 10px; max-width:70ch}
.wgrid{display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:16px}
.seg{display:flex; flex-wrap:wrap; border:1px solid var(--line); border-radius:9px; overflow:hidden; width:fit-content; max-width:100%}
.seg button{border:0; background:transparent; padding:6px 11px; cursor:pointer; font-size:12.5px; color:var(--muted); line-height:1.2; text-align:left}
.seg button + button{border-left:1px solid var(--line)}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.seg button .yours{display:block; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; opacity:.8}
.effects{margin:10px 0 0; padding:0; list-style:none; display:grid; gap:4px; font-size:13px}
.effects li{padding-left:14px; position:relative}
.effects li::before{content:""; position:absolute; left:2px; top:.55em; width:6px; height:6px; border-radius:2px; background:var(--accent)}
.range{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.range input[type=range]{accent-color:var(--accent); width:200px; max-width:60vw}
.prob{display:grid; gap:4px}
.prob .row{display:grid; grid-template-columns:62px minmax(0,1fr) 64px; gap:8px; align-items:center; font-size:12.5px}
.prob .track{height:10px; background:var(--surface-3); border-radius:5px; overflow:hidden}
.prob .track i{display:block; height:100%; background:var(--accent); border-radius:5px; min-width:2px}
.prob .v{font-family:var(--mono); text-align:right}
.stars{color:var(--accent); font-family:var(--mono); white-space:nowrap}
.wtable{width:100%; border-collapse:collapse; font-size:12.5px}
.wtable th{position:static; background:none; padding:5px 6px; cursor:default; font-size:10.5px; border-bottom:1px solid var(--line)}
.wtable td{padding:6px 6px; border-bottom:1px solid var(--line-soft); cursor:default; vertical-align:top}
.wtable tr:hover td{background:none}
.wtable td.num, .wtable th.num{text-align:right; font-family:var(--mono)}
.cond{font-size:12px; color:var(--muted)}
.cond b{color:var(--text)}
.ok{color:var(--good)} .no{color:var(--bad)}
.rar{display:flex; height:8px; border-radius:4px; overflow:hidden; background:var(--surface-3); min-width:110px}
.rar i{display:block; height:100%}
.r0{background:var(--r0)} .r1{background:var(--r1)} .r2{background:var(--r2)} .r3{background:var(--r3)} .r4{background:var(--r4)}
.legend{display:flex; flex-wrap:wrap; gap:10px; font-size:11.5px; color:var(--muted); margin-top:6px}
.legend span::before{content:""; display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; background:var(--c)}
.note{font-size:12px; color:var(--muted); margin:8px 0 0}
.callout{border-left:3px solid var(--accent); background:var(--accent-soft); padding:8px 11px; border-radius:6px; font-size:12.5px; margin:0 0 10px}
.wx{display:grid; gap:5px}
.wx .row{display:grid; grid-template-columns:130px minmax(0,1fr) 48px; gap:8px; align-items:center; font-size:12.5px}

<script>
(() => {
"use strict";
const COMBAT = ["slash","pierce","blunt","fire","frost","lightning","poison","spirit","damage"];
const DNAME = {slash:"Slash",pierce:"Pierce",blunt:"Blunt",fire:"Fire",frost:"Frost",lightning:"Lightning",poison:"Poison",spirit:"Spirit",damage:"True",chop:"Chop",pickaxe:"Pickaxe"};
const STATION_ORDER = ["piece_workbench","forge","piece_cauldron","piece_stonecutter","piece_artisanstation","blackforge","piece_magetable","piece_preptable","piece_MeadCauldron"];
const BIOME = {Meadows:"Meadows",BlackForest:"Black Forest",Swamp:"Swamp",Mountain:"Mountains",Plains:"Plains",Mistlands:"Mistlands",AshLands:"Ashlands",DeepNorth:"Deep North",Ocean:"Ocean"};
const MODNAME = {VeryWeak:"Very weak",Weak:"Weak",SlightlyWeak:"Slightly weak",SlightlyResistant:"Slightly resistant",Resistant:"Resistant",VeryResistant:"Very resistant",Immune:"Immune",Ignore:"Immune"};
const BOSSKEY = {defeated_eikthyr:"Eikthyr",defeated_gdking:"The Elder",defeated_bonemass:"Bonemass",defeated_dragon:"Moder",defeated_goblinking:"Yagluth",defeated_queen:"The Queen",defeated_fader:"Fader"};
const SRCK = {drop:"Dropped by",mine:"Mined from",chop:"Chopped from",break:"Found by breaking",chest:"Found in",pick:"Picked from",fish:"Caught",trade:"Sold by",other:"From"};
const CONVK = {smelter:"Smelted",cooking:"Cooked",fermenter:"Fermented",incinerator:"Obliterated",incineratorDefault:"Obliterated",beehive:"Produced",sap:"Collected",plant:"Grown"};
const CAT_ORDER = ["Misc","Crafting","Building","Heavy building","Furniture"];

let D, RBI = {}, USED = {}, PROD = {}, RBS = {}, CBS = {}, ENT = [], CLS = {}, GRP = {}, PIECE_EXT = {}, TRADERS = {}, BOSS_BY_KEY = {};
const S = {q:"", group:"weapons", cls:null, mod:"", nosrc:false, sel:null, hist:[], lvl:1, sort:{}, open:{}, collapsed:{}};
// World settings the numbers are shown under. Starts as the exported world; the World tab changes it.
const W = {opt:{}, base:{}, players:1, night:false};
const WORLD_GROUPS = ["creatures","bosses","events","locations","biomes","world"];
const BIOME_ORDER = ["Meadows","BlackForest","Swamp","Mountain","Plains","Mistlands","AshLands","DeepNorth","Ocean"];
const PROGRESSION = ["defeated_eikthyr","defeated_gdking","defeated_bonemass","defeated_dragon","defeated_goblinking","defeated_queen","defeated_fader","defeated_frozenking"];
const THEME_NAMES = {Crypt:"Crypt",SunkenCrypt:"Sunken crypt",Cave:"Frost cave",ForestCrypt:"Burial chambers",GoblinCamp:"Fuling village",MeadowsVillage:"Village",MeadowsFarm:"Farm",DvergerTown:"Infested mine",DvergerBoss:"Infested citadel",ForestCryptHildir:"Smouldering tomb",CaveHildir:"Howling cavern",PlainsFortHildir:"Sealed tower",AshlandRuins:"Ashlands ruins",FortressRuins:"Fortress ruins",Hole:"The hole",NorthVillage:"Northern village",MorkHalla:"Morkhalla"};
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s || "").toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
const compact = s => norm(s).replace(/ /g, "");
const sing = w => w.length > 3 && w.endsWith("s") && !w.endsWith("ss") ? w.slice(0, -1) : w;
const fmt = (v, d = 1) => v == null || v === "" ? "" : (Math.round(v * 10 ** d) / 10 ** d).toLocaleString("en-US");
const pct = v => (v > 0 ? "+" : "") + Math.round(v * 100) + "%";

function store(k, v){ try{ if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }

// ---------- icons
function icon(i, size = "", name = ""){
  const cls = size ? " " + size : "";
  if (i == null || i < 0 || !D.icons) return `<span class="ic none${cls}" aria-hidden="true">${esc((name || "?").trim()[0] || "?")}</span>`;
  const c = D.icons.cols;
  return `<span class="ic${cls}" style="--x:${i % c};--y:${Math.floor(i / c)}" aria-hidden="true"></span>`;
}
const item = id => D.items[id];
const iname = id => (D.items[id] && D.items[id].n) || (D.pieces[id] && D.pieces[id].n) || prettify(id);
const iicon = (id, size) => { const o = D.items[id] || D.pieces[id]; return icon(o ? o.i : -1, size, iname(id)); };
function prettify(p){ return String(p || "").replace(/_/g, " ").replace(/([a-z])([A-Z])/g, "$1 $2").replace(/\s+/g, " ").trim(); }
const stName = s => s ? ((D.stations[s] && D.stations[s].n) || (D.pieces[s] && D.pieces[s].n) || prettify(s)) : "By hand";
const stIcon = (s, size = "s22") => s ? icon(D.stations[s] ? D.stations[s].i : (D.pieces[s] ? D.pieces[s].i : -1), size, stName(s)) : "";
const biomes = arr => (arr || []).map(b => BIOME[b] || prettify(b)).join(", ");
const GLYPH = {
  mine:'<path d="M2.5 13.5l7-7M5 4.2c3-2 6.8-1.8 9 1.3-3-1-5.8-.8-7.8 1z"/>',
  chop:'<path d="M2.5 13.5l8-8M8.6 3.2l4.2 4.2-2.6 2.6c-2.1-.8-3.4-2.1-4.2-4.2z"/>',
  drop:'<path d="M4 3c1.8 3 1.8 7 0 10M8 2c2 4 2 8 0 12M12 3c1.8 3 1.8 7 0 10"/>',
  break:'<path d="M8 2v3.5M8 10.5V14M2 8h3.5M10.5 8H14M3.8 3.8l2.4 2.4M9.8 9.8l2.4 2.4M12.2 3.8 9.8 6.2M3.8 12.2l2.4-2.4"/>',
  chest:'<path d="M2 7h12v6H2zM2 7c0-2.8 2-4 6-4s6 1.2 6 4M7 8.2h2V10H7z"/>',
  pick:'<path d="M8 14V7.5M8 7.5C5 7.5 3 5.4 3 2.5c3 0 5 2 5 5zM8 10c1.6-1.4 3.6-1.6 5.2.2-1.8 1.4-3.6 1.4-5.2-.2z"/>',
  fish:'<path d="M2 8c3-4 7-4 10 0-3 4-7 4-10 0zM12 8l2.6-2.6v5.2z"/>',
  trade:'<circle cx="8" cy="8" r="5.6"/><path d="M8 4.8v6.4M9.8 6.3H7.4a1 1 0 0 0 0 2h1.2a1 1 0 0 1 0 2H6.2"/>',
  other:'<circle cx="8" cy="8" r="5"/>',
  raid:'<path d="M2.5 2.5l7 7M9.5 6.5l3 3-3 3M13.5 2.5l-7 7M6.5 6.5l-3 3 3 3"/>',
  pin:'<path d="M8 14s4.5-4.2 4.5-7.5a4.5 4.5 0 0 0-9 0C3.5 9.8 8 14 8 14z"/><circle cx="8" cy="6.5" r="1.6"/>',
  dungeon:'<path d="M2.5 13.5V7l5.5-4.5L13.5 7v6.5M6 13.5V10a2 2 0 0 1 4 0v3.5"/>',
  biome:'<path d="M1.5 13.5l4.5-7 3 4.5 2-3 3.5 5.5z"/>',
  trader:'<circle cx="8" cy="8" r="5.6"/><path d="M8 4.8v6.4M9.8 6.3H7.4a1 1 0 0 0 0 2h1.2a1 1 0 0 1 0 2H6.2"/>',
  rune:'<path d="M5 2.5h6l1 11H4zM8 5v6M6.5 6.5L8 8l1.5-1.5"/>'
};
function glyph(k, size = 22){
  if (typeof size === "string") size = {s18:18, s22:22, s36:36, s56:56}[size] || 28;
  return `<span class="glyph" style="--g:${size}px" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">${GLYPH[k] || GLYPH.other}</svg></span>`;
}
function crIcon(id, size = ""){
  const c = D.creatures[id];
  const t = c && (c.dr || []).map(d => d[0]).find(x => D.items[x] && D.items[x].c === "trophies");
  if (!t) return glyph("drop", size || 28);
  return icon(D.items[t].i, size, c ? c.n : id);
}
const crName = p => (D.creatures[p] && D.creatures[p].n) || prettify(p);
const dash = `<span class="dim">—</span>`;
function keyText(k){
  const lk = String(k || "").toLowerCase();
  if (BOSS_BY_KEY[lk]) return crName(BOSS_BY_KEY[lk]) + " defeated";
  if (BOSSKEY[lk]) return BOSSKEY[lk] + " defeated";
  let m = /^killed_?(.+)$/i.exec(k) || /^(.+?)_?killed$/i.exec(k);
  if (m) return "a " + prettify(m[1]).toLowerCase() + " has been killed";
  m = /^(.+?)_defeated$/i.exec(k);
  if (m) return prettify(m[1]) + " defeated";
  m = /^hildir(\d)$/i.exec(k);
  if (m) return "Hildir's quest " + m[1] + " started";
  if (/^GP_/.test(k) && D.ses[k]) return "you've taken " + D.ses[k].n + "'s forsaken power";
  if (/^\$se_(.+)_name$/.exec(k)) return "you've used " + prettify(/^\$se_(.+)_name$/.exec(k)[1]) + "'s forsaken power";
  return prettify(k);
}
function worldKeys(){ return new Set((D.world && D.world.keys || []).map(k => k.toLowerCase().split(" ")[0])); }
function eventPossible(ev){
  const keys = worldKeys();
  return ev.req.every(k => keys.has(k.toLowerCase())) && !ev.notReq.some(k => keys.has(k.toLowerCase()));
}
function parseKeys(list){
  const o = {};
  for (const k of list || []){ const [n, v] = String(k).toLowerCase().split(" "); o[n] = v === undefined ? true : +v; }
  return o;
}
// Effective world rates from the chosen slider options (percent values, 100 = vanilla).
function rates(){
  const r = {playerdamage:100, enemydamage:100, enemyspeedsize:100, enemyleveluprate:100, resourcerate:100, eventrate:100, skillreductionrate:100};
  for (const m of (D.world && D.world.modifiers) || []){
    const opt = m.opts.find(o => o.v === W.opt[m.id]) || m.opts.find(o => o.v === "Default");
    Object.assign(r, parseKeys(opt ? opt.keys : []));
  }
  return r;
}
const resRate = () => rates().resourcerate / 100;
const playerCount = () => Math.max(1, Math.min(W.players, (D.world && D.world.scale.maxPlayers) || 5));
function hpScale(){ return 1 + ((D.world && D.world.scale.hpPerPlayer) || 0.3) * (playerCount() - 1); }
function dmgScale(){ return (1 + ((D.world && D.world.scale.dmgPerPlayer) || 0.04) * (playerCount() - 1)) * rates().enemydamage / 100; }
function scaleAmt(a, item, kind){
  const nonScaled = (D.items[item] && D.items[item].c === "trophies") || kind === "trade";
  const r = nonScaled ? 1 : resRate();
  if (!a) return "";
  const lo = a[0] * r, hi = a[1] * r;
  return lo === hi ? fmt(lo, 1) : fmt(lo, 1) + "–" + fmt(hi, 1);
}
// StarLevelSystem: one roll against a falling chance table, capped by biome (LevelSelection.DetermineLevelRollResult).
function slsTable(tbl){ return Object.entries(tbl).map(([k, v]) => [+k, +v]).sort((a, b) => a[0] - b[0]); }
function starDist(biome, night, boss, table){
  const s = D.sls;
  if (!s) return null;
  const t = slsTable(table || s.table);
  const cap = boss ? s.maxBossLevel + 1 : (s.caps[biome] != null ? s.caps[biome] + 1 : s.maxLevel + 1);
  const mult = night ? (s.night || 1) : 1;
  const out = [];
  let prev = 100;
  for (let i = 0; i < t.length; i++){
    const [L, c] = t[i];
    if (L >= cap || i === t.length - 1){ out.push([Math.min(L, cap) - 1, prev]); prev = 0; break; }
    const a = Math.min(100, c * mult);
    out.push([L - 1, Math.max(0, prev - a)]);
    prev = a;
  }
  if (t.length && t[0][0] > 1){ /* conditional tables start above level 1 */ }
  return out.filter(x => x[1] > 0.00005);
}
function starMult(stars, boss){
  const s = D.sls || {hpPerLevel:1, dmgPerLevel:0.5, bossHpPerLevel:1, bossDmgPerLevel:0.5, loot:{scale:1}};
  const lvl = stars + 1;
  return {
    hp: 1 + (boss ? s.bossHpPerLevel : s.hpPerLevel) * (lvl - 1),
    dmg: 1 + (boss ? s.bossDmgPerLevel : s.dmgPerLevel) * (lvl - 1),
    loot: lvl <= 1 ? 1 : Math.max(1, Math.round(lvl * ((s.loot && s.loot.scale) || 1))),
  };
}
const starLabel = n => n ? `<span class="stars">${"★".repeat(Math.min(n, 5))}${n > 5 ? "+" + (n - 5) : ""}</span>` : `<span class="dim">no star</span>`;
const pctS = v => v >= 10 ? fmt(v, 0) + "%" : v >= 1 ? fmt(v, 1) + "%" : v >= 0.01 ? fmt(v, 2) + "%" : "<0.01%";
const keyName = k => BOSSKEY[k] ? "after " + BOSSKEY[k] : prettify(String(k).replace(/^defeated_/, "after "));

// ---------- recipe helpers
function recipeAmount(r, req, q){
  if (req[3] && req[3][q - 1] != null) return req[3][q - 1];
  return q <= 1 ? req[1] : req[2] * (q - 1);
}
function stationLevel(r, q){
  if (!r.s) return 0;
  if (r.lv && r.lv[q - 1] != null) return r.lv[q - 1];
  return Math.max(1, r.l) + q - 1;
}
const maxQ = o => (o.q ? o.q.length : 1);
const qv = (o, q, k) => { const e = o.q && o.q[Math.min(q, o.q.length) - 1]; return e ? e[k] : undefined; };
const dsum = (d, keys = COMBAT) => { let s = 0; if (d) for (const k of keys) s += d[k] || 0; return s; };
const isTool = o => ["pickaxes"].includes(o.c) || (o.q && o.q[0] && o.q[0].dmg && !dsum(o.q[0].dmg) && (o.q[0].dmg.chop || o.q[0].dmg.pickaxe));

// ---------- boot
async function boot(){
  try{
    const inline = document.getElementById("atlas-data");
    let iconUrl;
    if (inline){
      D = JSON.parse(inline.textContent);
      // A multi-MB data: URI is too long for a CSS variable, so hand CSS a short blob: URL instead.
      const m = /^data:([^;]+);base64,(.*)$/.exec(window.ATLAS_ICON_URL || "");
      if (m){
        const bin = atob(m[2]), bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        iconUrl = URL.createObjectURL(new Blob([bytes], {type:m[1]}));
      }
    }
    else { const r = await fetch("data.json"); if (!r.ok) throw new Error("data.json returned " + r.status); D = await r.json(); iconUrl = "icons.webp"; }
    if (D.icons){
      document.documentElement.style.setProperty("--icons", `url("${iconUrl}")`);
      document.documentElement.style.setProperty("--cols", D.icons.cols);
    }
  }catch(e){
    $("#results").innerHTML = `<div class="empty"><b>Couldn't load the atlas data.</b><br>${esc(e.message)}. Reload the page to try again.</div>`;
    return;
  }
  index();
  const m = D.meta || {};
  $("#meta").textContent = [m.profile, (m.mods || []).length + " mods", m.game ? "Valheim " + m.game : "", m.generated ? "exported " + new Date(m.generated).toLocaleDateString(undefined, {month:"short", day:"numeric", year:"numeric"}) : ""].filter(Boolean).join(" · ");
  const sel = $("#mod");
  for (const md of D.modsUsed) sel.insertAdjacentHTML("beforeend", `<option value="${esc(md)}">${esc(md)}</option>`);
  $("#foot").dataset.x = "";
  $("#foot").innerHTML = `Read straight from your game (${esc(m.mode === "game" ? "in-world export, server settings applied" : "main-menu export")}): ${Object.keys(D.items).length.toLocaleString()} items, ${D.recipes.length.toLocaleString()} recipes, ${Object.keys(D.pieces).length.toLocaleString()} building pieces, ${D.conversions.length} processing recipes, ${Object.keys(D.creatures).length} creatures. Damage is base weapon damage; skill level and combat mods change what actually lands.`;
  const saved = store("atlas.group");
  if (saved && GRP[saved]) S.group = saved;
  worldInit();
  wire();
  fromHash();
  render();
  if (!S.sel) renderDetail();
}

function worldInit(){
  if (!D.world) return;
  const have = new Set((D.world.keys || []).map(k => k.toLowerCase()));
  for (const m of D.world.modifiers){
    let pick = "Default", best = 0;
    for (const o of m.opts){ if (o.keys.length > best && o.keys.every(k => have.has(k.toLowerCase()))){ pick = o.v; best = o.keys.length; } }
    W.opt[m.id] = pick; W.base[m.id] = pick;
  }
  const sp = +store("atlas.players");
  if (sp > 0) W.players = sp;
  renderWorldNow();
}
function renderWorldNow(){
  const el = $("#worldnow");
  if (!el || !D.world) return;
  const bits = D.world.modifiers.filter(m => ["Combat","Resources","Raids"].includes(m.id)).map(m => {
    const o = m.opts.find(x => x.v === W.opt[m.id]);
    return `<span class="pill">${esc(m.n)}: ${esc(o ? o.n : "Normal")}</span>`;
  });
  const changed = Object.keys(W.opt).some(k => W.opt[k] !== W.base[k]);
  el.innerHTML = `<span>${changed ? "Showing a what-if world:" : "Numbers use your world:"}</span>${bits.join("")}<span class="pill">${W.players} player${W.players > 1 ? "s" : ""}</span><button class="lnk" data-group="world">${changed ? "Adjust" : "Change"}</button>`;
}
function index(){
  D.recipes.forEach((r, i) => {
    r.idx = i;
    (RBI[r.it] ||= []).push(r);
    (RBS[r.s || "_hand"] ||= []).push(r);
    for (const q of r.r) (USED[q[0]] ||= []).push({t:"recipe", r, a:q[1]});
  });
  for (const [id, p] of Object.entries(D.pieces)){
    for (const q of p.r) (USED[q[0]] ||= []).push({t:"piece", id, a:q[1]});
    if (p.ext) (PIECE_EXT[p.ext] ||= []).push(id);
  }
  D.conversions.forEach((c, i) => {
    c.idx = i;
    for (const x of c.out) (PROD[x[0]] ||= []).push(c);
    for (const x of c.in) (USED[x[0]] ||= []).push({t:"conv", c, a:x[1]});
    if (c.fuel) (USED[c.fuel] ||= []).push({t:"fuel", c, a:c.fp || 1});
    (CBS[c.st] ||= []).push(c);
  });
  for (const c of D.classes) CLS[c.k] = c;
  for (const g of D.groups) GRP[g.k] = g;

  // entities
  for (const [id, o] of Object.entries(D.items)){
    const cl = CLS[o.c] || {n:o.c, g:"other", a:""};
    const d0 = o.q && o.q[o.q.length - 1] && o.q[o.q.length - 1].dmg;
    const dtags = d0 ? Object.keys(d0).map(k => DNAME[k] || k).join(" ") : "";
    ENT.push({k:"item", id, o, g:cl.g, c:o.c, mod:o.m, name:o.n, nameN:norm(o.n), nameC:compact(o.n),

function visible(e){

  if (nC.includes(qC) || nC.includes(sing(qC))) return 600;
  const nameHit = toks.every(t => e.nameN.includes(t) || e.nameN.includes(sing(t)));
  if (nameHit) return 500;

  if (qC && out.length < 3){
    const ids = new Set(Object.entries(D.items).filter(([id, o]) => compact(o.n) === qC || compact(o.n) === sing(qC)).map(([id]) => id));

}

const COLS = {

// ---------- render: chips
function counts(){

function renderChips(ct){

      .sort((a, b) => (a.k === "cr|boss" ? -1 : b.k === "cr|boss" ? 1 : (order.indexOf(a.k.slice(3)) + 1 || 99) - (order.indexOf(b.k.slice(3)) + 1 || 99)));
  } else if (!["all","stations","events","biomes","world"].includes(S.group)){
    subs = D.classes.filter(c => c.g === S.group && ct.c[c.k]).map(c => ({k:c.k, n:c.n}));
  }
  $("#classes").hidden = subs.length < 2;

    `<button class="chip" data-cls="${esc(s.k)}" aria-pressed="${S.cls === s.k}">${esc(s.n)} <span class="ct">${ct.c[s.k]}</span></button>`)).join("");
}

// ---------- render: results
function sectionHTML(key, title, ents, gkey, note){
  const cols = COLS[gkey] || COLS.other;
  const [sk, sd] = S.sort[key] || S.sort[gkey] || DEFAULT_SORT[gkey] || ["item", 1];
  const cdef = col[sk] && cols.includes(sk) ? col[sk] : col[cols[0]];
  const sorted = ents.slice().sort((a, b) => {
    if (a._sc !== b._sc && S.q) return b._sc - a._sc;
    const va = cdef.sv(a), vb = cdef.sv(b);
    return (typeof va === "string" ? va.localeCompare(vb) : va - vb) * sd || a.name.localeCompare(b.name);
  });

  const toolKeys = gkey === "tools" ? ["chop","pickaxe"] : COMBAT;
  for (const e of ents){ if (e.k === "item" && e.o.q){ ctx.max = Math.max(ctx.max, dsum(e.o.q[e.o.q.length - 1].dmg, COMBAT), gkey === "tools" ? dsum(e.o.q[e.o.q.length - 1].dmg, toolKeys) : 0); } }
  const limit = S.open[key] ? 1e9 : (S.cls || ents.length <= 40 ? 400 : 25);

    const on = S.sel && S.sel.k === e.k && S.sel.id === e.id ? " class=\"on\"" : "";
    return `<tr data-go="${e.k}:${esc(e.id)}"${on}>${cols.map(c => `<td${col[c].n ? ` class="num"` : ""}>${col[c].cell(e, ctx)}</td>`).join("")}</tr>`;
  }).join("");
  const head = cols.map(c => `<th${col[c].n ? ` class="num"` : ""} data-sort="${c}" data-sec="${esc(key)}" aria-sort="${c === sk ? (sd > 0 ? "ascending" : "descending") : "none"}">${esc(col[c].h)}${c === sk ? ` <span class="sa">${sd > 0 ? "▲" : "▼"}</span>` : ""}</th>`).join("");
  const more = sorted.length > limit ? `<button class="more" data-more="${esc(key)}">Show all ${sorted.length.toLocaleString()}</button>` : "";
  const closed = !!S.collapsed[key];
  return `<section class="sec${closed ? " closed" : ""}" data-sec-key="${esc(key)}"><div class="sec-h" data-toggle="${esc(key)}" role="button" tabindex="0" aria-expanded="${!closed}"><span class="chev" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.5" d="M6 9l6 6 6-6"/></svg></span><h2>${esc(title)}</h2><span class="ct">${ents.length.toLocaleString()}</span>${note ? `<span class="note">${note}</span>` : ""}</div>
    <div class="tbl-wrap"><table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>${more}</div></section>`;
}
function render(){
  const ct = counts();

  for (const [sc, e] of res) e._sc = sc;
  const ents = res.map(x => x[1]);

    $("#results").innerHTML = worldPanel();

  }
  if (!ents.length){
    html = `<div class="empty"><b>Nothing matches “${esc(S.q)}”.</b><br>Try a shorter word, a weapon type like <i>atgeir</i>, a material like <i>bronze</i>, or clear the mod filter.</div>`;

const tag = (t, cls = "") => t ? `<span class="tag ${cls}">${esc(t)}</span>` : "";
function reqGrid(reqs, q = 1, r = null){
  const list = reqs.map(x => [x[0], r ? recipeAmount(r, x, q) : x[1]]).filter(x => x[1]);
  if (!list.length) return `<span class="dim">Free</span>`;
  return `<div class="reqs">${list.map(x => `<button class="req" data-go="item:${esc(x[0])}">${iicon(x[0], "s22")}<span class="q">${x[1]}</span><span class="rn">${esc(iname(x[0]))}</span></button>`).join("")}</div>`;
}
function inlineReqs(reqs, q, r){
  const list = reqs.map(x => [x[0], recipeAmount(r, x, q)]).filter(x => x[1]);
  if (!list.length) return `<span class="dim">—</span>`;
  return `<div class="mats">${list.map(x => `<button class="mat" data-go="item:${esc(x[0])}" title="${esc(iname(x[0]))}">${iicon(x[0], "s18")}<b>${x[1]}</b></button>`).join("")}</div>`;
}
function delta(a, b){ const d = (b || 0) - (a || 0); if (!d) return ""; return `<span class="${d > 0 ? "up" : "down"}">${d > 0 ? "+" : ""}${fmt(d)}</span>`; }

function itemDetail(id){
  const o = D.items[id];
  if (!o) return `<div class="inner"><p>Unknown item ${esc(id)}.</p></div>`;
  const cl = CLS[o.c];
  const recs = RBI[id] || [];
  let h = `<div class="inner">` + dhead(o.i, o.n, [tag(cl && cl.n), o.m !== "Valheim" ? tag(o.m, "mod") : tag("Vanilla"), o.sk ? tag(o.sk + " skill") : "", o.nt ? tag("Not teleportable", "warn") : ""], o.d);

  // how to craft
  if (recs.length){
    recs.forEach((r, n) => {
      h += `<div class="card"><h3>${recs.length > 1 ? `Recipe ${n + 1} of ${recs.length}` : "How to craft"}${r.a > 1 ? `<span class="aside">makes ${r.a}</span>` : ""}</h3>
        <div class="recipe-line">${r.s ? `<button class="gi" data-go="station:${esc(r.s)}">${stIcon(r.s)}${esc(stName(r.s))}<span class="x">Lv ${stationLevel(r, 1)}</span></button>` : `<span class="st hand">Crafted by hand from your inventory</span>`}
        ${r.rep ? `<span class="dim">Repair at ${esc(stName(r.rep))}</span>` : ""}${r.one ? tag("Needs only one of these") : ""}</div>
        ${reqGrid(r.r, 1, r)}</div>`;
    });
  }

  // upgrades table
  const r0 = recs[0];
  const mq = maxQ(o);
  if (o.q && (mq > 1 || o.q[0])){
    const hasD = o.q.some(e => dsum(e.dmg)), hasT = o.q.some(e => e.dmg && (e.dmg.chop || e.dmg.pickaxe));
    const hasA = o.q.some(e => e.arm), hasB = o.q.some(e => e.blk), hasU = o.q.some(e => e.dur);
    if (mq > 1){
      let rows = "";
      for (let q = 1; q <= mq; q++){
        const e = o.q[q - 1] || {}, p = o.q[q - 2] || null;
        rows += `<tr><td class="lvl">★${q}</td>
          <td>${r0 ? (r0.s ? `Lv ${stationLevel(r0, q)}` : "Hand") : "—"}</td>
          <td>${r0 ? inlineReqs(r0.r, q, r0) : "—"}</td>
          ${hasD ? `<td class="num">${fmt(dsum(e.dmg))}${p ? delta(dsum(p.dmg), dsum(e.dmg)) : ""}</td>` : ""}
          ${hasT && !hasD ? `<td class="num">${fmt(dsum(e.dmg, ["chop","pickaxe"]))}${p ? delta(dsum(p.dmg, ["chop","pickaxe"]), dsum(e.dmg, ["chop","pickaxe"])) : ""}</td>` : ""}
          ${hasA ? `<td class="num">${fmt(e.arm)}${p ? delta(p.arm, e.arm) : ""}</td>` : ""}
          ${hasB ? `<td class="num">${fmt(e.blk)}${p ? delta(p.blk, e.blk) : ""}</td>` : ""}

      h += `<div class="card"><h3>Upgrades <span class="aside">${r0 && r0.s ? "station level needed per item level" : ""}</span></h3>
        <div style="overflow-x:auto"><table class="dtable"><thead><tr><th>Item</th><th>Station</th><th>${r0 ? "Cost" : ""}</th>${hasD ? "<th class=num>Damage</th>" : ""}${hasT && !hasD ? "<th class=num>Chop/Pick</th>" : ""}${hasA ? "<th class=num>Armor</th>" : ""}${hasB ? "<th class=num>Block</th>" : ""}${hasU ? "<th class=num>Durability</th>" : ""}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
    }
    // stats at level
    const lv = Math.min(S.lvl, mq), e = o.q[lv - 1] || {};

    let stats = "";
    if (e.dmg && Object.keys(e.dmg).length){
      const mx = Math.max(...Object.values(e.dmg));
      const rowsD = Object.entries(e.dmg).sort((a, b) => b[1] - a[1]).map(([k, v]) => {

        return `<div class="row"><span class="dt" style="--c:var(--d-${k})">${esc(DNAME[k] || k)}</span><span class="track"><i class="d-${k}" style="width:${(v / mx * 100).toFixed(1)}%"></i></span><span class="v">${fmt(v)}${pv != null ? delta(pv, v) : ""}</span></div>`;

    if (e.dmg){ const pd = rates().playerdamage / 100; push("Total damage", fmt(dsum(e.dmg)), pd !== 1 ? `×${fmt(pd, 2)} in your world = ${fmt(dsum(e.dmg) * pd)}` : ""); }
    push("Armor", e.arm ? fmt(e.arm) : 0);
    push("Block", e.blk ? fmt(e.blk) : 0);
    const x = o.x || {};
    if (x.parry) push("Parry bonus", "×" + fmt(x.parry, 2));
    push("Knockback", e.dfl ? fmt(e.dfl) : 0, e.dfl ? "deflection" : "");
    push("Durability", e.dur ? fmt(e.dur, 0) : 0);
    if (o.atk){
      if (o.atk.stam) push("Attack stamina", fmt(o.atk.stam));
      if (o.atk.eitr) push("Attack eitr", fmt(o.atk.eitr));
      if (o.atk.hp) push("Attack health", fmt(o.atk.hp));
      if (o.atk.hpPct) push("Attack health", fmt(o.atk.hpPct * 100) + "%");
    }
    if (o.atk2){
      if (o.atk2.stam) push("Secondary stamina", fmt(o.atk2.stam));
      if (o.atk2.eitr) push("Secondary eitr", fmt(o.atk2.eitr));
      if (o.atk2.mult && o.atk2.mult !== 1) push("Secondary damage", "×" + fmt(o.atk2.mult, 2));
    }
    if (x.backstab) push("Backstab", "×" + fmt(x.backstab, 1));
    if (x.force) push("Knockback force", fmt(x.force));
    if (x.tier != null && (o.c === "pickaxes" || o.c === "axes" || o.c === "battleaxes" || o.c === "tools")) push("Tool tier", fmt(x.tier, 0));
    if (x.move) push("Movement", pct(x.move));
    for (const [k, lab] of [["eitrRegen","Eitr regen"],["heat","Heat resist"],["atkStam","Attack stamina"],["blkStam","Block stamina"],["dodgeStam","Dodge stamina"],["runStam","Run stamina"],["jumpStam","Jump stamina"],["swimStam","Swim stamina"],["sneakStam","Sneak stamina"],["homeStam","Home item stamina"]]) if (x[k]) push(lab, pct(x[k]));
    push("Weight", fmt(o.w));
    if (o.st > 1) push("Stack", o.st);
    if (o.val) push("Value", o.val, "coins");
    if (stats || kv.length) h += `<div class="card"><h3>Stats ${lvlBtns}</h3>${stats}${kv.length ? `<div class="kv" style="margin-top:${stats ? 12 : 0}px">${kv.join("")}</div>` : ""}</div>`;
  } else {
    const kv = [];
    kv.push(`<div><span>Weight</span><b>${fmt(o.w)}</b></div>`);
    if (o.st > 1) kv.push(`<div><span>Stack</span><b>${o.st}</b></div>`);
    if (o.val) kv.push(`<div><span>Value</span><b>${o.val} <small>coins</small></b></div>`);
    if (!o.food) h += `<div class="card"><h3>Stats</h3><div class="kv">${kv.join("")}</div></div>`;
  }

  if (o.food){
    const f = o.food, kv = [];
    for (const [k, lab] of [["hp","Health"],["stam","Stamina"],["eitr","Eitr"]]) if (f[k]) kv.push(`<div><span>${lab}</span><b>${fmt(f[k], 0)}</b></div>`);
    if (f.time) kv.push(`<div><span>Lasts</span><b>${fmt(f.time / 60, 0)} <small>min</small></b></div>`);
    if (f.regen) kv.push(`<div><span>Regen</span><b>${fmt(f.regen)} <small>hp/tick</small></b></div>`);
    kv.push(`<div><span>Weight</span><b>${fmt(o.w)}</b></div>`);
    h += `<div class="card"><h3>Food</h3><div class="kv">${kv.join("")}</div></div>`;
  }
  for (const [k, lab] of [["cons","When consumed"],["eq","While equipped"],["atkse","On hit"]]){
    const s = D.ses[o[k]];
    if (s) h += `<div class="card"><h3>${lab}${s.d ? `<span class="aside">${dur(s.d)}</span>` : ""}</h3><div class="se"><b>${esc(s.n)}</b>${esc(s.t)}</div></div>`;
  }
  if (o.res && o.res.length){
    h += `<div class="card"><h3>Resistances</h3><div class="pillset">${o.res.map(([t, m]) => `<span class="pill ${/Weak/.test(m) ? "bad" : "good"}">${esc(DNAME[t.toLowerCase()] || t)}: ${esc(MODNAME[m] || m)}</span>`).join("")}</div></div>`;
  }
  if (o.set){
    const members = (D.sets[o.set] || []).filter(p => p !== id);
    const s = D.ses[o.setse];
    h += `<div class="card"><h3>Set bonus <span class="aside">wear ${o.setn || "all"} pieces</span></h3>${s ? `<div class="se"><b>${esc(s.n)}</b>${esc(s.t)}</div>` : ""}
      <div class="grid-items" style="margin-top:8px">${[id].concat(members).map(p => `<button class="gi" data-go="item:${esc(p)}">${iicon(p, "s22")}${esc(iname(p))}</button>`).join("")}</div></div>`;
  }

  // where to get
  const prod = PROD[id] || [], srcs = D.sources[id] || [];
  if (prod.length || srcs.length){
    let s = "";
    if (prod.length){
      s += `<div class="k">Processing</div>` + prod.map(c => `<div class="it" data-go="station:${esc(c.st)}" role="button" tabindex="0">${stIcon(c.st)}<span class="t">${esc((CONVK[c.k] || "Made") + " in " + stName(c.st))}<small>${c.in.length ? esc(c.in.map(x => (x[1] > 1 ? x[1] + "× " : "") + iname(x[0])).join(" + ")) : ""}${c.out[0][1] > 1 ? " → " + c.out[0][1] + "×" : ""}${c.fuel ? " · fuel: " + esc(iname(c.fuel)) : ""}${c.biome ? " · " + esc(biomes(String(c.biome).split(/, ?/))) : ""}</small></span><span class="r">${c.t ? dur(c.t) : ""}</span></div>`).join("");
    }
    const byK = {};
    for (const x of srcs) (byK[x.k] ||= []).push(x);
    for (const [k, arr] of Object.entries(byK)){
      arr.sort((a, b) => (b.p || 1) - (a.p || 1));
      s += `<div class="k">${esc(SRCK[k] || k)}</div>` + arr.slice(0, 14).map(x => {
        const go = D.creatures[x.f] ? `creature:${x.f}` : D.pieces[x.f] ? `piece:${x.f}` : "";
        const amt = x.a ? scaleAmt(x.a, id, x.k) : "";
        const sub = [x.b ? biomes(x.b) : "", x.tier ? tierHint(x.tier, k) : "", x.price ? x.price + " coins" : "", x.key ? keyName(x.key) : ""].filter(Boolean).join(" · ");
        return `<div class="it"${go ? ` data-go="${esc(go)}" role="button" tabindex="0"` : ""}>${D.creatures[x.f] ? crIcon(x.f, "s22") : (D.pieces[x.f] || D.items[x.f]) ? iicon(x.f, "s22") : glyph(k)}<span class="t">${esc(x.fn)}${x.boss ? " " + tag("Boss", "boss") : ""}${sub ? `<small>${esc(sub)}</small>` : ""}</span><span class="r">${amt ? "×" + amt : ""}${x.p ? `<br>${fmt(x.p * 100, 1)}%` : ""}</span></div>`;
      }).join("") + (arr.length > 14 ? `<p class="dim" style="margin:4px 0 0;font-size:12px">+${arr.length - 14} more</p>` : "");
    }
    if (o.chestAt && o.chestAt.length) s += `<div class="k">Chests at these locations</div><div class="grid-items">${o.chestAt.map(l => D.locations[l] ? `<button class="gi" data-go="loc:${esc(l)}">${locIcon(D.locations[l], "s22")}${esc(D.locations[l].n)}</button>` : "").join("")}</div>`;
    const rr = resRate();
    h += `<div class="card"><h3>Where to get it${rr !== 1 && o.c !== "trophies" ? `<span class="aside">amounts ×${fmt(rr, 2)} for Resources</span>` : ""}</h3><div class="src">${s}</div></div>`;
  } else if (!recs.length){
    h += `<div class="card"><h3>Where to get it</h3><p class="dim" style="margin:0">No recipe, drop or trader found. It probably comes from world chests, events, bounties or another mod's system.</p></div>`;
  }

  // used in
  const used = USED[id] || [];
  if (used.length){
    const rec = used.filter(u => u.t === "recipe"), pcs = used.filter(u => u.t === "piece"), cv = used.filter(u => u.t === "conv" || u.t === "fuel");
    const key = "used:" + id;
    const lim = S.open[key] ? 1e9 : 30;
    let u = "";
    if (rec.length) u += `<div class="lvlhead">Crafting · ${rec.length}</div><div class="grid-items">${rec.slice(0, lim).map(x => `<button class="gi" data-go="item:${esc(x.r.it)}">${iicon(x.r.it, "s22")}${esc(iname(x.r.it))}<span class="x">${x.a || ""}</span></button>`).join("")}</div>`;
    if (pcs.length) u += `<div class="lvlhead">Building · ${pcs.length}</div><div class="grid-items">${pcs.slice(0, lim).map(x => `<button class="gi" data-go="piece:${esc(x.id)}">${icon(D.pieces[x.id].i, "s22", D.pieces[x.id].n)}${esc(D.pieces[x.id].n)}<span class="x">${x.a}</span></button>`).join("")}</div>`;
    if (cv.length) u += `<div class="lvlhead">Processing · ${cv.length}</div><div class="src">${cv.slice(0, lim).map(x => `<div class="it" data-go="station:${esc(x.c.st)}" role="button" tabindex="0">${stIcon(x.c.st)}<span class="t">${esc(stName(x.c.st))}<small>${x.t === "fuel" ? "Fuel" : esc(x.c.in.map(y => iname(y[0])).join(" + "))} → ${esc(x.c.out.map(y => iname(y[0])).join(", "))}</small></span><span class="r">${x.c.t ? dur(x.c.t) : ""}</span></div>`).join("")}</div>`;
    const tooMany = Math.max(rec.length, pcs.length, cv.length) > lim;
    h += `<div class="card"><h3>Used in <span class="aside">${used.length} recipe${used.length > 1 ? "s" : ""}</span></h3>${u}${tooMany ? `<button class="more" style="border-radius:8px;margin-top:8px" data-more="${esc(key)}">Show all</button>` : ""}</div>`;
  }
  if (o.tip) h += `<div class="card"><details class="tip"><summary>In-game tooltip${mq > 1 ? " (max level)" : ""}</summary><pre>${esc(o.tip)}</pre></details></div>`;
  return h + `</div>`;
}
function tierHint(t, k){
  const cls = k === "chop" ? ["axes","battleaxes","dualaxes"] : ["pickaxes"];
  const tools = Object.entries(D.items).filter(([id, o]) => cls.includes(o.c) && o.x && o.x.tier >= t && RBI[id]).sort((a, b) => a[1].x.tier - b[1].x.tier);
  return tools.length ? `needs ${tools[0][1].n} or better` : `tool tier ${t}+`;
}

  if (kv.length) h += `<div class="card"><h3>Properties</h3><div class="kv">${kv.join("")}</div>${p.fl ? `<div class="pillset" style="margin-top:8px">${p.fl.map(f => `<span class="pill">${esc(f)}</span>`).join("")}</div>` : ""}</div>`;

  }
  if (D.stations[id]) h += `<div class="card"><h3>Crafting station</h3><button class="gi" data-go="station:${esc(id)}">${stIcon(id)}See everything made here<span class="x">${(RBS[id] || []).length}</span></button></div>`;
  if (CBS[id]) h += convCard(id);

}

}

function keyEffect(k){
  const [name, v] = String(k).toLowerCase().split(" "), n = +v;
  const R = D.world && D.world.raid;
  switch (name){
    case "playerdamage": return `You deal ${n}% damage`;
    case "enemydamage": return `Enemies deal ${n}% damage`;
    case "enemyspeedsize": return n > 100 ? `Enemies are ${n - 100}% faster and bigger` : `Enemies are ${100 - n}% slower and smaller`;
    case "enemyleveluprate": return `Vanilla star chances ×${fmt(n / 100, 2)}${D.sls ? " (StarLevelSystem rolls stars in this pack instead)" : ""}`;
    case "resourcerate": return `×${fmt(n / 100, 2)} resources from mining, chopping, picking, chests and creature drops (trophies excluded)`;
    case "eventrate": return n === 0 ? "No raids at all" : R ? `A raid roll every ${fmt(R.interval * n / 100, 0)} min with a ${fmt(R.chance / (n / 100), 1)}% chance` : `Raid rate ${n}%`;
    case "skillreductionrate": return `Dying costs ${n}% of the normal skill loss`;
    case "deathkeepequip": return "Keep your equipped gear when you die";
    case "deathdeleteitems": return "Everything you carry is destroyed when you die";
    case "deathdeleteunequipped": return "Unequipped items are destroyed when you die";
    case "deathskillsreset": return "All skills reset to zero when you die";
    case "teleportall": return "Portals accept every item, including ores and metals";
    case "nobossportals": return "No portals near boss altars or inside boss dungeons";
    case "noportals": return "Portals can't be used";
    default: return prettify(k);
  }
}

function wire(){
  const q = $("#q");
  let t;
  q.addEventListener("input", () => {
    clearTimeout(t);
    t = setTimeout(() => {
      const had = !!S.q;
      S.q = q.value.trim();
      if (S.q && !had){ S.group = "all"; S.cls = null; }
      if (!S.q && had){ S.group = store("atlas.group") || "weapons"; S.cls = null; }
      S.open = {};
      render();
    }, 110);
  });
  document.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement !== q && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){ e.preventDefault(); q.focus(); q.select(); }
    if (e.key === "Escape"){
      if ($("#detail").classList.contains("open") && matchMedia("(max-width:1100px)").matches) openSheet(false);
      else if (document.activeElement === q && q.value){ q.value = ""; q.dispatchEvent(new Event("input")); }
    }
    if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("[role=button][data-go]")){ e.preventDefault(); e.target.click(); }
  });
  $("#mod").addEventListener("change", e => { S.mod = e.target.value; render(); });
  $("#nosrc").addEventListener("change", e => { S.nosrc = e.target.checked; render(); });
  document.addEventListener("click", e => {
    const el = e.target.closest("[data-go],[data-group],[data-cls],[data-sort],[data-more],[data-lvl],[data-back],[data-close],[data-toggle],[data-collapse],[data-w-mod],[data-w-reset],[data-w-night]");
    if (!el) return;
    if (el.dataset.toggle){ toggleSection(el.dataset.toggle); return; }
    if (el.dataset.collapse){
      const on = el.dataset.collapse === "1";
      document.querySelectorAll("#results .sec[data-sec-key]").forEach(sec => { S.collapsed[sec.dataset.secKey] = on; sec.classList.toggle("closed", on); sec.querySelector(".sec-h").setAttribute("aria-expanded", String(!on)); });
      saveCollapsed(); return;
    }
    if (el.dataset.wMod){ W.opt[el.dataset.wMod] = el.dataset.wOpt; worldChanged(); return; }
    if (el.hasAttribute("data-w-reset")){ Object.assign(W.opt, W.base); worldChanged(); return; }
    if (el.dataset.wNight){ W.night = el.dataset.wNight === "1"; worldChanged(); return; }
    if (el.dataset.group){ S.group = el.dataset.group; S.cls = null; S.open = {}; if (S.group !== "all") store("atlas.group", S.group); render(); return; }
    if (el.dataset.cls !== undefined){ S.cls = el.dataset.cls || null; S.open = {}; render(); return; }
    if (el.dataset.sort){
      const key = el.dataset.sec, c = el.dataset.sort;
      const g = key.split(":")[1];
      const cur = S.sort[key] || S.sort[g] || DEFAULT_SORT[g] || [];
      const dir = cur[0] === c ? -cur[1] : (col[c].n ? -1 : 1);
      S.sort[key] = [c, dir]; S.sort[g] = [c, dir];
      render(); return;
    }
    if (el.dataset.more){ S.open[el.dataset.more] = true; if (el.closest("#detail")) renderDetail(); else render(); return; }
    if (el.dataset.lvl){ S.lvl = +el.dataset.lvl; const sc = $("#detail").scrollTop; renderDetail(); $("#detail").scrollTop = sc; return; }
    if (el.hasAttribute("data-back")){ const p = S.hist.pop(); if (p){ S.sel = p; renderDetail(); } return; }
    if (el.hasAttribute("data-close")){ openSheet(false); return; }
    if (el.dataset.go){
      e.preventDefault();
      const i = el.dataset.go.indexOf(":");
      select(el.dataset.go.slice(0, i), el.dataset.go.slice(i + 1));
    }
  });
  window.addEventListener("hashchange", fromHash);
  document.addEventListener("input", e => {
    if (e.target.id === "w-players"){ W.players = +e.target.value; store("atlas.players", String(W.players)); worldChanged(); }
  });
  document.addEventListener("keydown", e => {
    const h = e.target.closest && e.target.closest("[data-toggle]");
    if (h && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); toggleSection(h.dataset.toggle); }
  });
  try{ S.collapsed = JSON.parse(store("atlas.collapsed") || "{}") || {}; }catch(err){ S.collapsed = {}; }
}
function saveCollapsed(){ store("atlas.collapsed", JSON.stringify(S.collapsed)); }
function toggleSection(key){
  S.collapsed[key] = !S.collapsed[key];
  if (!S.collapsed[key]) delete S.collapsed[key];
  const sec = [...document.querySelectorAll("#results .sec[data-sec-key]")].find(x => x.dataset.secKey === key);
  if (sec){ sec.classList.toggle("closed", !!S.collapsed[key]); sec.querySelector(".sec-h").setAttribute("aria-expanded", String(!S.collapsed[key])); }
  saveCollapsed();
}
function worldChanged(){
  const sy = window.scrollY, dy = $("#detail").scrollTop;
  renderWorldNow();
  render();
  if (S.sel) renderDetail();
  window.scrollTo(0, sy);
  $("#detail").scrollTop = dy;
}
boot();
})();
</script>

</body></html>
